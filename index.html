  const curCat = ev.swapped ? LIB.find(t=>t.id===ev.swapped).cat : (CATS.find(c => c.name === ev.cat.name) || CATS[1]).key;
  cat = cat || curCat;
  let h = `<h2>Training tauschen</h2><p class="small muted">Alle auf ${mins(ev.baseDur)} min angepasst · ${nice(ev.date)}</p>`;
  h += `<div class="catrow" style="display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px">${CATS.map(c => `<button class="chip" data-act="pswapcat" data-id="${id}" data-v="${c.key}" style="flex:none;${c.key===cat?`background:${c.col};color:var(--bg)`:'color:var(--lilac)'}">${c.name}</button>`).join('')}</div>`;
  h += `<div class="list">`;
  for (const t of LIB.filter(x => x.cat === cat)){
    const cand = tryChange(id, { swap:{ tpl:t.id } });
    const cur = ev.swapped === t.id;
    h += `<button class="ev" data-act="pswappick" data-id="${id}" data-v="${t.id}" style="flex-direction:column;align-items:stretch;gap:8px;${cur?'outline:2px solid var(--lime)':''}">
      <span class="row"><span class="n" style="font-weight:700">${esc(t.name)}</span><span class="small muted">${cur?'aktuell · ':''}${mins(cand.dur)} min · ${cand.load}</span></span>
      <span style="display:block;background:var(--bg);border-radius:10px;padding:6px">${profileSVG(cand.steps,40)}</span></button>`;
  }
  openCatSheet(h + `</div>`);
}
function applyChange(id, change){
  const before = compTargets();
  if ('variant' in change){ if (change.variant) ST.variants[id] = change.variant; else delete ST.variants[id]; }
  if ('swap' in change){ if (change.swap){ ST.swaps[id] = change.swap; delete ST.variants[id]; } else delete ST.swaps[id]; }
  ST.time = ST.time || {};
  if ('time' in change){ if (change.time) ST.time[id] = change.time; else delete ST.time[id]; }
  ADJ = null;
  const ev = plan().find(e => String(e.id) === String(id));
  const c = ev ? compensate(ev) : null;
  save(); closeSheet(); render();
  syncShapes([id, ...before, ...compTargets()]);
  if (c) toast(`Übernommen. Ausgleich: ${WD[wd(c.tgt.date)]} ${c.tgt.name} +${mins(c.extra)} min locker`);
  else toast('Übernommen');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, id, v } = b.dataset;
  if (act === 'vprev'){
    const raw = SNAP.events.find(x => String(x.id) === String(id)); const cur = ST.variants[id];
    if (cur === v){ previewSheet(id, { variant:null }, 'Zurücksetzen'); return; }
    previewSheet(id, { variant:v }, VARIANTS[v]);
  }
  if (act === 'pswap') planSwapSheet(id);
  if (act === 'pswapcat') planSwapSheet(id, v);
  if (act === 'pswappick') previewSheet(id, { swap:{ tpl:v } }, 'Training tauschen');
  if (act === 'pcancel'){ PENDING = null; closeSheet(); }
  if (act === 'papply' && PENDING){ const P = PENDING; PENDING = null; applyChange(P.id, P.change); }
  if (act === 'restore'){
    const raw = SNAP.events.find(x => String(x.id) === String(id)); if (!raw) return;
    if (!b.dataset.confirmed){ previewSheet(id, { variant:null, swap:null, time:null }, 'Original wiederherstellen'); return; }
  }
});

// Kategorie-Reihe behält ihre Scroll-Position, wenn man eine Kategorie antippt
function openCatSheet(html){
  const row = document.querySelector('.sheet .catrow');
  const keep = row ? row.scrollLeft : null;
  openSheet(html);
  const nr = document.querySelector('.sheet .catrow');
  if (!nr) return;
  // Beim Öffnen immer bei Erholung starten (leicht → schwer), beim Wechseln die Position halten
  if (keep !== null) nr.scrollLeft = keep;
}

/* ---------- Sheets ---------- */
function openSheet(html){ closeSheet(); const d=document.createElement('div'); d.className='scrim'; d.id='scrim'; d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${html}</div>`; d.addEventListener('click',e=>{ if(e.target===d) closeSheet(); }); document.body.appendChild(d); }
function closeSheet(){ const s=$('#scrim'); if(s) s.remove(); }
function toast(t){ const o=document.createElement('div'); o.className='toast'; o.textContent=t; document.body.appendChild(o); setTimeout(()=>o.remove(),3200); }

function menuSheet(id){
  const ev = plan().find(e=>String(e.id)===String(id)); if(!ev) return;
  const st = statusOf(ev);
  let h = `<h2>${esc(ev.name)}</h2><p class="small muted">${nice(ev.date)} · ${ev.cat.name} · ${mins(ev.dur)} min</p>`;
  h += `<button class="btn" data-act="detail" data-id="${ev.id}">Details ansehen</button>`;
  if (st.s!=='done' && ev.date>=TODAY){
    h += `<button class="btn" data-act="move" data-id="${ev.id}">Verschieben</button>`;
    if (isRun(ev.type)){ h += `<button class="btn" data-act="pswap" data-id="${ev.id}">Training tauschen</button>`; h += variantGrid(ev); }
    if (ev.modified) h += `<button class="btn ghost" data-act="restore" data-id="${ev.id}">Original wiederherstellen</button>`;
    h += `<button class="btn ghost" data-act="remove" data-id="${ev.id}">Streichen</button>`;
  }
  openSheet(h);
}
function conflict(ev, day){
  // Ampel: rot = harte Einheit am selben Tag, gelb = harte Einheit am Vortag/Folgetag oder schon eine Einheit am Tag
  const others = plan().filter(e=>e.id!==ev.id);
  const on = others.filter(e=>e.date===day);
  const near = others.filter(e=>e.date===addDays(day,-1)||e.date===addDays(day,1));
  if (on.some(e=>e.cat.hard) && ev.cat.hard) return { c:'r', why:'Am selben Tag liegt schon eine harte Einheit.' };
  if (ev.cat.hard && near.some(e=>e.cat.hard)) return { c:'y', why:`Direkt daneben liegt ${near.find(e=>e.cat.hard).name}. Zwei harte Tage hintereinander erhöhen das Verletzungsrisiko.` };
  if (on.length) return { c:'y', why:`An dem Tag steht schon ${on[0].name}. Doppeltag möglich, aber anstrengend.` };
  return { c:'g', why:'Passt gut.' };
}
function unfitSheet(id){
  openSheet(`<h2>Heute nicht fit</h2><p class="small muted">Was ist los? Der Plan passt sich an.</p>
  <button class="btn" data-act="unfit-go" data-v="zeit" data-id="${id}">Wenig Zeit</button>
  <button class="btn" data-act="unfit-go" data-v="muede" data-id="${id}">Müde oder schlecht geschlafen</button>
  <button class="btn" data-act="unfit-go" data-v="krank" data-id="${id}">Krank oder Schmerzen</button>`);
}

/* ---------- Aktionen ---------- */
function setVariant(id, v){
  const ev0 = plan().find(e=>String(e.id)===String(id));
  const before = compTargets();
  if (ST.variants[id]===v) delete ST.variants[id]; else ST.variants[id]=v;
  const ev = plan().find(e=>String(e.id)===String(id));
  const c = compensate(ev);
  save(); closeSheet(); render();
  syncShapes([id, ...before, ...compTargets()]);
  if (c) toast(`Ausgleich: ${WD[wd(c.tgt.date)]} ${c.tgt.name} +${mins(c.extra)} min locker`);
  else if (ev.load < ev.baseLoad) toast('Angepasst. Der kleine Rest wird nicht nachgeholt, das ist okay.');
  else toast(ST.variants[id] ? `Angepasst: ${VARIANTS[v]}` : 'Zurückgesetzt');
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const { act, id, v, d } = b.dataset;
  if (act==='detail'){ closeSheet(); location.hash = `#detail-${id}`; }
  if (act==='menu') menuSheet(id);
  if (act==='variant') setVariant(id, v);
  if (act==='reset'){ const before = compTargets(); delete ST.variants[id]; compensate(plan().find(x=>String(x.id)===String(id))); save(); render(); toast('Zurückgesetzt'); syncShapes([id, ...before, ...compTargets()]); }
  if (act==='move') moveSheet(id);
  if (act==='moveto'){
    const ev = plan().find(x=>String(x.id)===String(id));
    const c = d===ev.date ? null : conflict(ev,d);
    if (c && c.c!=='g' && b.dataset.confirm!=='1'){ $('#mvhint').textContent = `${c.why} Nochmal tippen zum Bestätigen.`; document.querySelectorAll('.mv [data-confirm]').forEach(x=>x.dataset.confirm=''); b.dataset.confirm='1'; return; }
    if (d===dateOf(ev.raw.start_date_local)) delete ST.moves[id]; else ST.moves[id]=d;
    save(); closeSheet(); render(); toast(`Verschoben auf ${nice(d)}`);
    pushMove(id, d);
  }
  if (act==='remove'){
    if (LIVE && b.dataset.ok!=='1'){ openSheet(`<h2>Einheit streichen?</h2><p style="line-height:1.5">Sie wird auch aus Intervals und von deiner Uhr entfernt.</p><div class="grid2"><button class="btn ghost" data-act="dragno">Abbrechen</button><button class="btn" data-act="remove" data-ok="1" data-id="${id}" style="background:#FF6B6B;color:var(--bg)">Streichen</button></div>`); return; }
    ST.removed[id]=true; save(); closeSheet(); render(); toast('Gestrichen. Lockere Einheiten holen wir nicht nach.'); pushDelete(id); }
  if (act==='unfit') unfitSheet(id);
  if (act==='unfit-go'){
    ST.unfit[TODAY]=v;
    if (v==='zeit') setVariant(id,'kuerzer');
    if (v==='muede') setVariant(id,'leichter');
    if (v==='krank'){ ST.removed[id]=true; const all = plan().filter(x=>x.date>TODAY && x.date<=addDays(TODAY,2) && x.cat.hard); const hard = all.filter(x=>isOwn(x.raw)), foreign = all.filter(x=>!isOwn(x.raw)); hard.forEach(x=>ST.variants[x.id]='leichter'); save(); closeSheet(); render();
      toast(foreign.length ? `Heute Pause. ${foreign.map(x=>`${WD[wd(x.date)]} ${x.name}`).join(', ')} ist von ${sourceOf(foreign[0].raw)} – tipp es an, wenn du es entschärfen willst.` : 'Heute Pause. Die nächsten harten Einheiten sind entschärft.');
      pushDelete(id); syncShapes(hard.map(x=>String(x.id))); }
  }
  if (act==='feel'){ ST.feel[id]=v; save(); render(); toast('Danke, fließt in die nächste Woche ein.'); }
  if (act==='noop') toast('Liegt schon auf deiner Uhr.');
});

function render(){
  try { autoReplan(); } catch(e){}
  const h = location.hash.replace('#','') || 'heute';
  const m = h.match(/^([a-z]+)(?:-(\d+))?$/) || [null,'heute']; const r = m[1], id = m[2];
  const root = $('#root');
  const V = { woche:viewWeek, detail:()=>viewDetail(id), form:viewForm, workouts:viewWorkouts, gen:viewGenerated, bib:()=>viewLibrary(id), ziel:viewGoal, planvorschau:viewPlanPreview };
  root.innerHTML = `<main class="app">${(V[r]||viewToday)()}</main>`;
}
addEventListener('hashchange', ()=>{ closeSheet(); window.scrollTo(0,0); render(); });
function loginView(msg){
  return `<main class="app" style="justify-content:center;min-height:90vh">
    <div class="logo" style="font-size:32px;justify-content:center"><span>ON</span><span class="tog off" style="width:52px;height:30px;padding:4px"><i style="width:22px;height:22px"></i></span><span>TRACK</span></div>
    <form id="loginform" class="note" style="display:flex;flex-direction:column;gap:12px">
      <label class="small muted" style="display:flex;flex-direction:column;gap:6px">Zugangscode
        <input type="password" name="token" autocomplete="current-password" style="height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-family:inherit;font-size:16px"></label>
      <p class="small" style="color:#FF6B6B;min-height:18px" role="alert">${msg||''}</p>
      <button class="btn lime" type="submit">Los</button></form></main>`;
}
async function loadLive(token){
  const r = await fetch(`${CONFIG.apiBase}/api/snapshot`, { headers:{ Authorization:`Bearer ${token}` } });
  if (r.status === 401) return 'auth';
  if (!r.ok) return 'err';
  SNAP = await r.json(); TODAY = SNAP.today; THR = SNAP.settings.threshold_pace_ms;
  return 'ok';
}
async function init(){
  if (LIVE){
    let token = ''; try { token = localStorage.getItem('ontrack.token') || ''; } catch(e){}
    if (!token){ $('#root').innerHTML = loginView(); return; }
    $('#root').innerHTML = `<main class="app" style="justify-content:center;min-height:90vh;text-align:center"><p class="muted">Lade deine Daten …</p></main>`;
    let res = 'err';
    try { res = await loadLive(token); } catch(e){}
    if (res === 'auth'){ try { localStorage.removeItem('ontrack.token'); } catch(e){} $('#root').innerHTML = loginView('Der Zugangscode stimmt nicht.'); return; }
    if (res === 'err' && !SNAP.events.length){ $('#root').innerHTML = loginView('Server nicht erreichbar. Bitte später nochmal versuchen.'); return; }
  }
  render();
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'loginform') return;
  e.preventDefault();
  const t = new FormData(e.target).get('token').trim();
  if (!t) return;
  try { localStorage.setItem('ontrack.token', t); } catch(e){}
  init();
});
init();
</script>
