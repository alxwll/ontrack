<style>
:root{
  --bg:#2A0F5C; --bg2:#3A1A78; --card:#6D28FF; --line:#4B2A8A;
  --lilac:#C9B6FF; --soft:#E4D9FF; --text:#F1EAFF; --lime:#D7FF3D;
  --z1:#C9B6FF; --z2:#FFD84D; --z3:#FF8A1F; --z4:#FF3B3B; --z5:#E838A8; --str:#9B8AD9;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--lime)}

.preview{font-size:12px;color:var(--lilac);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;line-height:1.4}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.5px}
.tog{width:28px;height:16px;border-radius:99px;background:var(--lime);display:flex;justify-content:flex-end;padding:2px}

.tog.off{background:var(--line);justify-content:flex-start}.tog.off i{background:var(--lilac)}
.muted{color:var(--lilac)} .small{font-size:13px} p{margin:0}

.status{display:flex;flex-direction:column;gap:8px}

.stats{display:flex;gap:24px}.stats .k{font-size:13px;color:var(--soft)}.stats .v{font-size:22px;font-weight:700}
.prof{display:block;background:var(--bg);border-radius:16px;padding:12px 12px 8px;color:var(--lilac);text-decoration:none;border:none;width:100%;text-align:left}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{height:48px;border-radius:14px;border:none;background:var(--bg);color:var(--text);font-size:15px;font-weight:700}
.btn.ghost{background:transparent;border:2px solid var(--lilac);color:var(--lilac)}

.note b{color:var(--text)}

.bar i{display:block;height:100%;background:var(--lime)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:13px}
.days span.d{width:14px;height:14px;border-radius:99px;display:inline-block}
.list{display:flex;flex-direction:column;gap:10px}
.wday{display:flex;flex-direction:column;gap:6px}
.wday .lbl{font-size:13px;color:var(--lilac);font-weight:700}
.wday .lbl.today{color:var(--lime)}
.ev{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:16px;padding:12px 14px;border:none;color:var(--text);text-align:left;width:100%}
.ev .stripe{width:6px;align-self:stretch;border-radius:3px;flex:none}
.ev .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.ev .n{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 12px calc(8px + env(safe-area-inset-bottom))}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.scrim{position:fixed;inset:0;background:rgba(10,0,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.sheet > *{flex-shrink:0}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;box-sizing:content-box;padding:10px 40px;margin:-10px 0 -6px;background-clip:content-box;touch-action:none}

.weekhead{display:flex;align-items:center;justify-content:space-between}
.weekhead button{height:44px;min-width:44px;border-radius:12px;border:none;background:var(--bg2);color:var(--text);font-weight:700;padding:0 12px}
.form{display:flex;gap:10px}
.form > div{flex:1;background:var(--bg2);border-radius:16px;padding:12px 14px}
.form .k{font-size:12px;color:var(--lilac)}.form .v{font-size:20px;font-weight:700}
.fb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fb button{height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--lilac);font-weight:700}
.fb button.sel{border-color:var(--lime);color:var(--lime)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--lilac);font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
.seg button.on{background:var(--lime);border-color:var(--lime);color:var(--bg)}
.scrubtip{position:sticky;top:8px;z-index:5;gap:12px;flex-wrap:wrap;align-items:center;background:var(--text);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ev[data-id]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;transform-origin:center;box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:.95;border-radius:16px}
.ev.lifted{opacity:.3}
.wday.drop-g{outline:2px dashed #7CE38B;outline-offset:4px;border-radius:12px}
.wday.drop-y{outline:2px dashed #FFC857;outline-offset:4px;border-radius:12px}
.wday.drop-r{outline:2px dashed #FF6B6B;outline-offset:4px;border-radius:12px}
.weeksep{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 0 8px;display:flex;flex-direction:column;gap:6px}
.mvweek{display:flex;flex-direction:column;gap:6px}
</style>

<body>
<div id="root"></div>
<script id="snapshot" type="application/json">{"today": "2026-11-13", "settings": {"threshold_pace_ms": 3.5, "lthr": 170}, "events": [], "activities": [], "wellness": [], "streams": {}}</script>
<script>
"use strict";
/* ---------- Konfiguration ---------- */
const CONFIG = { apiBase: "https://ontrack.x-sall.workers.dev" }; // später: URL des Cloudflare Workers, z. B. "https://ontrack.<name>.workers.dev"

/* ---------- Daten ---------- */
let SNAP = JSON.parse(document.getElementById('snapshot').textContent);
const store = (() => { try { const k='ontrack.v1'; return { get:()=>JSON.parse(localStorage.getItem(k)||'{}'), set:v=>localStorage.setItem(k,JSON.stringify(v)) }; } catch(e){ return { get:()=>({}), set:()=>{} }; } })();
const ST = Object.assign({ moves:{}, variants:{}, removed:{}, comp:{}, feel:{}, auto:{}, unfit:{}, orig:{}, swaps:{}, checkin:{}, time:{} }, store.get());
const save = () => { try { store.set(ST); } catch(e){} };

let TODAY = SNAP.today;
let THR = SNAP.settings.threshold_pace_ms; // m/s an der Schwelle
const LIVE = !!CONFIG.apiBase;

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d2 = n => String(n).padStart(2,'0');
const dateOf = s => s.slice(0,10);
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const fmtD = dt => `${dt.getUTCFullYear()}-${d2(dt.getUTCMonth()+1)}-${d2(dt.getUTCDate())}`;
const addDays = (s,n) => { const dt=parseD(s); dt.setUTCDate(dt.getUTCDate()+n); return fmtD(dt); };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
const wd = s => parseD(s).getUTCDay();
const monday = s => addDays(s, -((wd(s)+6)%7));
const nice = s => `${WD[wd(s)]}, ${parseD(s).getUTCDate()}. ${MON[parseD(s).getUTCMonth()]}`;
const mins = sec => Math.round(sec/60);
const paceStr = ms => { if(!ms) return '–'; const s=Math.round(1000/ms); return `${Math.floor(s/60)}:${d2(s%60)}`; };
const pctToPace = p => paceStr(THR*p/100);
/* ---------- Puls-Ziele: %LTHR <-> Intensität (Pace-%) für Farbe, Höhe und Belastung ---------- */
function lerpMap(x, M, i, j){ for (let k = 1; k < M.length; k++){ const a = M[k-1], b = M[k]; if (x <= b[i] || k === M.length-1){ const t = (x - a[i]) / (b[i] - a[i]); return a[j] + t * (b[j] - a[j]); } } return x; }
const LTHR = () => SNAP.settings.lthr || 165, HRMAX = () => SNAP.settings.max_hr || 190;
// Deine Pulszonen (Obergrenzen in bpm) auf die fünf Intensitätszonen legen: Puls-Z2 = Locker usw.
function hrMap(){
  let z = (SNAP.settings.hr_zones || []).filter(Boolean);
  if (z.length < 5){ const L = LTHR(); z = [L*.81, L*.89, L*.93, L*.99, HRMAX()]; }
  if (z.length > 5) z = [z[0], z[1], z[2], z[3], z[z.length-1]];
  return [[z[0]*.7, 55], [z[0], 80], [z[1], 90], [z[2], 96], [z[3], 102], [Math.max(z[4], z[3]+5), 112]];
}
const bpmToPct = b => lerpMap(b, hrMap(), 0, 1), pctToBpmRaw = p => lerpMap(p, hrMap(), 1, 0);
const lthrToPct = l => bpmToPct(l / 100 * LTHR()), pctToLthr = p => pctToBpmRaw(p) / LTHR() * 100;
const pctToBpm = p => Math.round(pctToBpmRaw(p));
function hrZoneOf(bpm){ const z = SNAP.settings.hr_zones || []; const i = z.findIndex(u => bpm <= u); return 'Z' + (i < 0 ? Math.max(1, z.length) : i + 1); }
function bpmRange(s){ const lo = Math.min(s.pace.start, s.pace.end), hi = Math.max(s.pace.start, s.pace.end); return [pctToBpm(lo), pctToBpm(hi)]; }
// Zieltext für Anzeigen: Pace oder Puls, je nach Schritt
function targetTxt(s){
  if (!s.pace) return '';
  if (s.hrMode){ const [a, b] = bpmRange(s); return `${hrZoneOf(Math.round((a+b)/2))} · ${a}–${b} bpm`; }
  const lo = Math.min(s.pace.start, s.pace.end), hi = Math.max(s.pace.start, s.pace.end);
  return `${pctToPace(hi)}–${pctToPace(lo)} /km`;
}
const withHr = (steps, on) => steps.map(s => s.steps ? Object.assign({}, s, { steps: withHr(s.steps, on) }) : s.pace ? Object.assign({}, s, { hrMode: !!on }) : s);
const cleanName = n => (n||'').replace(/^IntervalCoach\s*-\s*/,'');
// Eigene Trainings: von On. Track angelegt oder verändert. Nur die fasst die Automatik an.
const OWN_MARK = '[on.track]';
const isOwn = raw => !!raw && (/^On\.Track/.test(raw.name||'') || (raw.description||'').includes(OWN_MARK) || !!(ST.orig && ST.orig[raw.id]));
const sourceOf = raw => isOwn(raw) ? 'On. Track' : /^IntervalCoach/.test(raw.name||'') ? 'IntervalCoach' : 'Extern';
const isRun = t => /Run/.test(t||'');
const isStrength = t => /Weight|Strength/.test(t||'');

/* Zonen über % der Schwellenpace */
const ZONES = [
  { max:80,  name:'Erholung', col:'var(--z1)', hex:'#C9B6FF' },
  { max:90,  name:'Locker',   col:'var(--z2)', hex:'#FFD84D' },
  { max:96,  name:'Tempo',    col:'var(--z3)', hex:'#FF8A1F' },
  { max:102, name:'Schwelle', col:'var(--z4)', hex:'#FF3B3B' },
  { max:999, name:'VO2max',   col:'var(--z5)', hex:'#E838A8' },
];
const zoneOf = p => ZONES.find(z => p < z.max) || ZONES[4];

/* ---------- Workout-Schritte ---------- */
// Intervals kennt Pace als Bereich (%), Einzelwert (%) oder Zone. Alles auf einen Bereich in % umrechnen.
function normStep(s){
  const t = Object.assign({}, s);
  const p = s.pace;
  // Puls-Ziel (Zone, %LTHR, %HFmax oder bpm) in Intensität umrechnen, Schritt als Puls-Schritt markieren
  if (s.hr && (!p || (p.start == null && p.value == null))){
    const h = s.hr, z = SNAP.settings.hr_zones || [], L = LTHR();
    const toL = v => h.units === '%hr' ? v * HRMAX() / L : h.units === '%lthr' ? v : v / L * 100;
    let lo, hi;
    if (h.units === 'hr_zone'){ const v = Math.max(1, Math.min(z.length || 5, Math.round(h.value ?? h.start ?? 2))); lo = (v === 1 ? (z[0] || 130) * 0.85 : z[v-2]) / L * 100; hi = Math.min(z[v-1] || L, HRMAX()) / L * 100; }
    else if (h.start != null){ lo = toL(h.start); hi = toL(h.end ?? h.start); }
    else if (h.value != null){ lo = toL(h.value) - 2; hi = toL(h.value) + 2; }
    if (lo != null){ t.pace = { start: lthrToPct(lo), end: lthrToPct(hi), units:'%pace' }; t.hrMode = true; return t; }
  }
  if (p){
    if (p.units === 'pace_zone' && p.value != null){
      const z = SNAP.settings.pace_zones || [80,90,96,102,999];
      const v = Math.max(1, Math.min(z.length, Math.round(p.value)));
      const lo = v === 1 ? 70 : z[v-2], hi = z[v-1] >= 200 ? lo + 8 : z[v-1];
      t.pace = { start: lo, end: hi, units:'%pace' };
    } else if (p.start == null && p.value != null){
      t.pace = { start: p.value - 2, end: p.value + 2, units:'%pace' };
    } else if (p.start == null) delete t.pace;
  }
  return t;
}
function flatten(steps, out=[]) {
  for (const s of steps||[]) {
    if (s.steps && s.reps) { for (let i=0;i<s.reps;i++) flatten(s.steps,out); }
    else if (s.steps) flatten(s.steps,out);
    else out.push(normStep(s));
  }
  return out;
}
const stepPct = s => s.pace ? (s.pace.start + s.pace.end)/2 : 70;
const estLoad = steps => steps.reduce((a,s)=>a + (s.duration||0)/3600 * Math.pow(stepPct(s)/100,2)*100, 0);

function stepLabel(s){
  if (s.warmup) return 'Einlaufen';
  if (s.cooldown) return 'Auslaufen';
  return s.text || zoneOf(stepPct(s)).name;
}

/* Variante anwenden: leichter / schwerer / kürzer / länger */
const VARIANTS = { leichter:'Leichter', schwerer:'Schwerer', kuerzer:'Kürzer', laenger:'Länger' };
// Auf eine Wunschdauer bringen: erst lockere Teile stauchen, dann harte Wiederholungen von hinten streichen (mind. die Hälfte bleibt)
function trimSteps(steps0, minutes){
  const steps = steps0.map(s => Object.assign({}, s)), target = minutes * 60;
  const tot = () => steps.reduce((a,s)=>a+(s.duration||0),0);
  const easyIdx = () => steps.map((s,i)=>i).filter(i => stepPct(steps[i]) < 88 && steps[i].duration >= 120);
  if (tot() < target - 30){
    let i = easyIdx().sort((a,b)=>steps[b].duration-steps[a].duration)[0]; if (i == null) i = 0;
    steps[i].duration += Math.round((target - tot())/30)*30; return steps;
  }
  for (const i of easyIdx().sort((a,b)=>steps[b].duration-steps[a].duration)){
    const s = steps[i], min = s.warmup ? 300 : s.cooldown ? 180 : Math.max(120, s.duration * 0.4);
    const cut = Math.min(tot() - target, s.duration - min);
    if (cut > 0) s.duration = Math.max(min, Math.round((s.duration - cut)/30)*30);
    if (tot() - target <= 30) break;
  }
  const isHard = i => stepPct(steps[i]) >= 90 && steps[i].duration >= 45;
  let removable = Math.floor(steps.filter((s,i)=>isHard(i)).length / 2);
  while (tot() - target > 30 && removable > 0){
    const hi = [...steps.keys()].filter(isHard).pop();
    const nx = steps[hi+1], pv = steps[hi-1];
    if (nx && stepPct(nx) < 88 && !nx.cooldown) steps.splice(hi, 2);
    else if (pv && stepPct(pv) < 88 && !pv.warmup) steps.splice(hi-1, 2);
    else steps.splice(hi, 1);
    removable--;
  }
  return steps;
}
function applyVariant(steps, v){
  // Kurze Abschnitte (unter 90 s, z. B. Steigerungen) behalten ihre Dauer
  const r30 = (x, orig) => orig < 90 ? orig : Math.max(60, Math.round(x/30)*30);
  return steps.map(s => {
    const t = Object.assign({}, s, s.pace ? { pace:Object.assign({},s.pace) } : {});
    const p = stepPct(s), hard = p >= 90, easy = !hard && p >= 75;
    if (v==='kuerzer') t.duration = r30(s.duration * (hard ? 0.8 : 0.75), s.duration);
    if (v==='laenger') t.duration = hard ? s.duration : r30(s.duration * 1.25, s.duration);
    // Leichter/Schwerer wirken auf harte UND lockere Abschnitte, Traben und Erholung bleiben gleich
    // Leichter: harte Blöcke spürbar ruhiger (−6 %) und 20 % kürzer, lockere Abschnitte etwas langsamer
    // kurze Steigerungen fallen bei Leichter weg: werden locker gelaufen
    if (v==='leichter' && t.pace && p >= 102 && s.duration < 90){ t.pace.start = 82; t.pace.end = 88; return t; }
    if (v==='leichter' && t.pace && hard){ t.pace.start-=6; t.pace.end-=6; t.duration = r30(s.duration * 0.8, s.duration); }
    if (v==='leichter' && t.pace && easy){ t.pace.start-=3; t.pace.end-=3; }
    if (v==='schwerer' && t.pace && (hard || easy)){ const d = 2; t.pace.start+=d; t.pace.end+=d; }
    return t;
  });
}

/* ---------- Plan zusammensetzen ---------- */
function eventDate(e){ return ST.moves[e.id] || dateOf(e.start_date_local); }
function category(e, steps){
  if (isStrength(e.type)) return { name:'Kraft', col:'var(--str)', hard:false, key:false };
  // Hart ist eine Einheit erst ab 8 min über 90 % der Schwellenpace; kurze Steigerungen zählen nicht
  const hardSteps = steps.filter(s => stepPct(s) >= 90);
  const hardSec = hardSteps.reduce((a,s)=>a+(s.duration||0),0);
  let z;
  if (hardSec >= 480){
    const w = hardSteps.reduce((a,s)=>a+stepPct(s)*s.duration,0)/hardSec;
    z = zoneOf(w);
  } else z = /Erholung|Shakeout/i.test(e.name) ? ZONES[0] : ZONES[1];
  return { name:z.name, col:z.col, hard: hardSec >= 480, key: hardSec >= 480 || (e.moving_time||0) >= 4800 };
}
function buildEvent(e0){
  // Hat On. Track das Workout schon in Intervals geändert, rechnen wir vom Original aus
  const o = ST.orig && ST.orig[e0.id];
  const e = o ? Object.assign({}, e0, { workout_doc:o.workout_doc, icu_training_load:o.load, name:o.name }) : e0;
  let base = flatten(e.workout_doc && e.workout_doc.steps);
  const origBase = base;
  const sw = ST.swaps && ST.swaps[e0.id];
  const swT = sw && typeof LIB !== 'undefined' ? LIB.find(t => t.id === sw.tpl) : null;
  if (swT){ const minutes = Math.max(20, Math.round(base.reduce((a,x)=>a+(x.duration||0),0)/60) || 45); base = flatSteps(fitWorkout(swT, minutes, sw.lvl ?? 2).steps); }
  let steps = base, eased = null;
  const v = ST.variants[e.id];
  // Leichter bei Sprints oder VO2max-Intervallen: nicht nur langsamer, sondern ein lockerer Dauerlauf gleicher Dauer
  const fastSec = base.filter(s => stepPct(s) >= 102).reduce((a,x)=>a+(x.duration||0),0);
  if (v === 'leichter' && typeof LIB !== 'undefined' && fastSec >= 180){
    let minutes = Math.max(20, Math.round(base.reduce((a,x)=>a+(x.duration||0),0)/60) || 45);
    const cap = estLoad(base) * 0.85;
    steps = flatSteps(fitWorkout(LIB.find(t => t.id === 'GRU-1'), minutes).steps);
    while (estLoad(steps) > cap && minutes > 20){ minutes -= 5; steps = flatSteps(fitWorkout(LIB.find(t => t.id === 'GRU-1'), minutes).steps); }
    eased = 'Lockerer Dauerlauf';
  } else if (v) steps = applyVariant(base, v);
  const tm = ST.time && ST.time[e0.id];
  if (tm) steps = trimSteps(steps, tm);
  const hm = ST.hrm && ST.hrm[e0.id];
  if (hm != null) steps = withHr(steps, hm);
  const extra = ST.comp[e.id] || 0; // Ausgleich in Sekunden, wird auf den längsten lockeren Abschnitt gelegt
  if (extra && steps.length){
    steps = steps.map(s=>Object.assign({},s));
    let idx = -1, best = 0;
    steps.forEach((s,i)=>{ if (stepPct(s) < 90 && s.duration > best){ best=s.duration; idx=i; } });
    if (idx>=0) steps[idx].duration += extra;
  }
  const baseDur = base.reduce((a,s)=>a+(s.duration||0),0) || e.moving_time || 0;
  const dur = steps.length ? steps.reduce((a,s)=>a+(s.duration||0),0) : (e.moving_time||0);
  const ratio = origBase.length ? estLoad(steps)/Math.max(estLoad(origBase),0.1) : 1;
  const load = Math.round((e.icu_training_load||0) * ratio);
  const cat = eased ? category(Object.assign({}, e, { name: eased }), steps) : category(swT ? Object.assign({}, e, { name: swT.name, moving_time: base.reduce((a,x)=>a+x.duration,0) }) : e, base);
  return { raw:e0, id:e.id, date:eventDate(e), eased, name: eased || (swT ? swT.name : cleanName(e.name)), origName: cleanName(e.name), type:e.type, steps, base, origSteps: origBase, dur, baseDur, load, baseLoad:e.icu_training_load||0, cat, variant:v, extra, swapped: swT ? swT.id : null, timed: tm || null, hrSet: hm ?? null, modified: !!(v || swT || tm || hm != null) };
}
function plan(){
  return SNAP.events.filter(e => e.category==='WORKOUT' && !ST.removed[e.id]).map(buildEvent).sort((a,b)=>a.date.localeCompare(b.date));
}
function activitiesOn(day){ return SNAP.activities.filter(a => dateOf(a.start_date_local)===day); }
function matchAct(ev){
  const paired = ev.raw.paired_activity_id && SNAP.activities.find(a=>a.id===ev.raw.paired_activity_id);
  if (paired) return paired;
  const same = a => isRun(ev.type) ? isRun(a.type) : isStrength(ev.type) ? isStrength(a.type) : !isRun(a.type);
  const taken = new Set(SNAP.events.map(x=>x.paired_activity_id).filter(Boolean));
  const free = a => same(a) && !taken.has(a.id);
  const sameDay = activitiesOn(ev.date).find(free);
  if (sameDay) return sameDay;
  if (isStrength(ev.type)) { // Kraft ist flexibel: einen Tag davor oder danach zählt auch
    for (const d of [addDays(ev.date,-1), addDays(ev.date,1)]) { const a = activitiesOn(d).find(free); if (a && d<=TODAY) return a; }
  }
  return null;
}
function statusOf(ev){
  const act = matchAct(ev);
  if (act) return { s:'done', act };
  if (ev.date < TODAY) return { s:'missed' };
  if (ev.date === TODAY) return { s:'today' };
  return { s:'planned' };
}
/* Wochenbilanz und Status "Läuft." */
function weekInfo(mon){
  const days = [...Array(7)].map((_,i)=>addDays(mon,i));
  const evs = plan().filter(e => e.date>=mon && e.date<=days[6]);
  const planned = evs.reduce((a,e)=>a+e.load,0);
  const done = SNAP.activities.filter(a=>{const d=dateOf(a.start_date_local);return d>=mon&&d<=days[6];}).reduce((a,x)=>a+(x.icu_training_load||0),0);
  const dueEvs = evs.filter(e=>e.date<TODAY);
  const missedKey = dueEvs.filter(e=>statusOf(e).s==='missed' && e.cat.key);
  const dueLoad = dueEvs.reduce((a,e)=>a+e.load,0);
  const doneDue = SNAP.activities.filter(a=>{const d=dateOf(a.start_date_local);return d>=mon&&d<TODAY;}).reduce((a,x)=>a+(x.icu_training_load||0),0);
  const onTrack = missedKey.length===0 && (dueLoad===0 || doneDue >= dueLoad*0.8);
  return { days, evs, planned, done, onTrack, missedKey };
}

/* ---------- Grafiken ---------- */
let PFB = [];
function profileSVG(steps, h, opts={}){
  const total = steps.reduce((a,s)=>a+(s.duration||0),0);
  if (!total) return '';
  const W = 350, H = 140, gap = 2;
  let x = 0, rects = '';
  const hOf = p => Math.max(18, Math.min(1, (p-55)/(110-55)) * H);
  const blocks = [];
  for (const s of steps){
    blocks.push({ x0:x, x1:x+Math.max(1,(s.duration/total)*W-gap), s });
    const w = (s.duration/total)*W, p = stepPct(s), hh = hOf(p), z = zoneOf(p);
    const hollow = z === ZONES[0];
    const ww = Math.max(1,w-gap);
    if (s.ramp && s.pace && !hollow){
      // Rampe: Fläche steigt von Start- auf Endpace, Farbe der Zielzone
      const h0 = hOf(s.pace.start), h1 = hOf(s.pace.end), zc = zoneOf(Math.max(s.pace.start, s.pace.end)).hex;
      rects += `<path d="M${x.toFixed(1)},${H} L${x.toFixed(1)},${(H-h0).toFixed(1)} L${(x+ww).toFixed(1)},${(H-h1).toFixed(1)} L${(x+ww).toFixed(1)},${H} Z" fill="${zc}"${opts.faded?' fill-opacity="0.8"':''} stroke-linejoin="round"></path>`;
      x += w; continue;
    }
    rects += hollow
      ? `<rect x="${(x+1).toFixed(1)}" y="${(H-hh+1).toFixed(1)}" width="${Math.max(1,ww-2).toFixed(1)}" height="${(hh-2).toFixed(1)}" rx="4" fill="${z.hex}" fill-opacity="${opts.faded?0.1:0.2}" stroke="${z.hex}" stroke-width="2" vector-effect="non-scaling-stroke"${opts.faded?' stroke-opacity="0.5"':''}></rect>`
      : `<rect x="${x.toFixed(1)}" y="${(H-hh).toFixed(1)}" width="${ww.toFixed(1)}" height="${hh.toFixed(1)}" rx="4" fill="${z.hex}"${opts.faded?' fill-opacity="0.8"':''}></rect>`;
    x += w;
  }
  let line = '', hits = '';
  PFB = [];
  const durTxt = d => d < 90 ? `${d} s` : `${Math.round(d/60*2)/2} min`.replace('.5', ',5');
  const avgIn = {};
  if (opts.stream){
    const pts = opts.stream.filter(r=>r[1]>0.5);
    const tEnd = Math.max(...opts.stream.map(r=>r[0])) || total;
    const xy = (px, v) => `${px.toFixed(1)},${(H-hOf(v/THR*100)).toFixed(1)}`;
    // Rohdaten blass
    const raw = pts.map(r => xy(r[0]/tEnd*W, r[1])).join(' ');
    // Geglättet: gleitender Median (~100 s) gegen GPS-Aussetzer, danach leicht gemittelt
    const med = pts.map((r,i) => { const w = pts.slice(Math.max(0,i-2), i+3).map(q=>q[1]).sort((a,b)=>a-b); return [r[0], w[Math.floor(w.length/2)]]; });
    const sm = med.map((r,i) => { const w = med.slice(Math.max(0,i-1), i+2); return [r[0], w.reduce((a,q)=>a+q[1],0)/w.length]; });
    const smooth = sm.map(r => xy(r[0]/tEnd*W, r[1])).join(' ');
    line = `<polyline fill="none" stroke="#C9B6FF" stroke-opacity=".4" stroke-width="1.2" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${raw}"></polyline>`
         + `<polyline fill="none" stroke="#2A0F5C" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${smooth}"></polyline><polyline fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${smooth}"></polyline>`;
    // Abschnitts-Schnitt gestrichelt (ab 2,5 min), Antippen zeigt Ø und Ziel
    blocks.forEach((b, i) => {
      if (b.s.duration < 150 || !b.s.pace) return;
      const inB = sm.filter(r => { const px = r[0]/tEnd*W; return px >= b.x0 && px <= b.x1; });
      if (inB.length < 2) return;
      let v = inB.reduce((a,r)=>a+r[1],0)/inB.length, pct = v/THR*100;
      const lo = Math.min(b.s.pace.start, b.s.pace.end), hi = Math.max(b.s.pace.start, b.s.pace.end);
      let ok = pct >= lo - 2 && pct <= hi + 2, hrAvg = null, bLo, bHi;
      if (b.s.hrMode){
        const hs = pts.filter(r => { const px = r[0]/tEnd*W; return px >= b.x0 && px <= b.x1 && r[2] > 0; });
        if (hs.length){ hrAvg = Math.round(hs.reduce((a,r)=>a+r[2],0)/hs.length); [bLo, bHi] = bpmRange(b.s); ok = hrAvg >= bLo - 3 && hrAvg <= bHi + 3; pct = lthrToPct(hrAvg / LTHR() * 100); }
      }
      const y = (H - hOf(pct)).toFixed(1);
      line += `<line x1="${(b.x0+2).toFixed(1)}" x2="${(b.x1-2).toFixed(1)}" y1="${y}" y2="${y}" stroke="#2A0F5C" stroke-width="5" vector-effect="non-scaling-stroke"></line><line x1="${(b.x0+2).toFixed(1)}" x2="${(b.x1-2).toFixed(1)}" y1="${y}" y2="${y}" stroke="#D7FF3D" stroke-width="2.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"></line>`;
      avgIn[i] = { v, ok, pct, hi, hr: hrAvg, bHi };
    });
  }
  // Antippbare Blöcke: Dauer und Pace-Spanne, bei gelaufenen Einheiten plus Schnitt
  if (opts.tap){
    blocks.forEach((b, i) => {
      const s = b.s; if (!s.pace) return;
      const lo = Math.min(s.pace.start, s.pace.end), hi = Math.max(s.pace.start, s.pace.end), a = avgIn[i];
      let txt = `${durTxt(s.duration)} · ${targetTxt(s)}`;
      if (a && a.hr) txt += ` · Ø ${a.hr} bpm ${a.ok ? '✓' : a.hr > a.bHi ? 'zu hoch' : 'zu niedrig'}`;
      else if (a) txt += ` · Ø ${paceStr(a.v)} ${a.ok ? '✓' : a.pct > a.hi + 2 ? 'zu schnell' : 'zu langsam'}`;
      PFB.push({ si: i, x0: b.x0/W*100, x1: (b.x1+gap)/W*100, txt, ok: a ? a.ok : true, name: (zn => zn + (s.text && !s.text.toLowerCase().includes(zn.toLowerCase()) ? ` · ${s.text}` : ''))(zoneOf(stepPct(s)).name) });
    });
  }
  const svg = `<svg width="100%" height="${h}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Profil der Einheit">${rects}${line}${hits}</svg>`;
  return opts.tap ? `<div data-pf style="position:relative;touch-action:pan-y;-webkit-tap-highlight-color:transparent;cursor:ew-resize;user-select:none">${svg}<div id="pfcur" style="display:none;position:absolute;top:-4px;bottom:0;width:0;border-left:2.5px dashed var(--lime);pointer-events:none"></div><div id="pfpill" aria-live="polite"></div></div>` : svg;
}
function legendHTML(){ return `<div class="legend">${ZONES.map((z,i)=>`<span><i style="${i===0?`border:2px solid ${z.hex};box-sizing:border-box`:`background:${z.hex}`}"></i>${z.name}</span>`).join('')}</div>`; }

function coachLine(ev){

function debrief(ev, act, stream){

/* ---------- Ausgleich ---------- */
function compensate(ev){
  // Wenn eine Einheit reduziert wurde: Defizit auf den nächsten lockeren Lauf dieser Woche legen, gedeckelt auf +15 %
  const deficit = ev.baseLoad - ev.load;
  const wk = monday(ev.date), end = addDays(wk,6);
  const cand = plan().filter(e => e.id!==ev.id && e.date>ev.date && e.date<=end && e.date>=TODAY && isRun(e.type) && !e.cat.hard && !ST.variants[e.id] && isOwn(e.raw));
  Object.keys(ST.comp).forEach(k=>{ if (ST.comp[k] && ST.comp[k+'_from']===ev.id){ delete ST.comp[k]; delete ST.comp[k+'_from']; } });
  if (deficit <= 2 || !cand.length) return null;
  const tgt = cand[0];
  const cap = tgt.baseLoad * 0.15;
  const add = Math.min(deficit, cap);
  const secPerLoad = 3600 / (100*Math.pow(0.82,2)); // lockere Minuten pro Belastungspunkt
  const extra = Math.round(add*secPerLoad/60)*60;
  if (extra < 120) return null;
  ST.comp[tgt.id] = extra; ST.comp[tgt.id+'_from'] = ev.id;
  return { tgt, extra, rest: Math.round(deficit-add) };
}

function stepRow(s){

  const pace = x => targetTxt(x);

function compress(steps){
  // Wiederholungen zusammenfassen: gleiche Schritte und gleiche Paare (Block + Pause)
  const same = (a,b) => a && b && a.duration===b.duration && stepPct(a)===stepPct(b) && stepLabel(a)===stepLabel(b);
  const out = []; let i = 0;
  while (i < steps.length){
    const a = steps[i], b = steps[i+1];
    let k = 1;
    if (b && !same(a,b)){
      while (same(steps[i+2*k], a) && same(steps[i+2*k+1], b)) k++;
      if (k >= 2){ out.push(Object.assign({n:k, pair:b}, a)); i += 2*k; continue; }
    }
    k = 1; while (same(steps[i+k], a)) k++;
    out.push(Object.assign({n:k}, a)); i += k;
  }
  return out;
}

const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
function readiness(){

  const today = SNAP.wellness.find(x => x.id === TODAY);
  const t = today && (today.hrv || today.sleepSecs) ? today : {};
  const prior = SNAP.wellness.filter(x => x.id < TODAY && x.id >= addDays(TODAY, -30));
  const base = k => { const v = prior.map(x => x[k]).filter(Boolean); return v.length >= 5 ? v.reduce((a,b)=>a+b,0) / v.length : null; };
  let sc = 70; const why = [];
  const hb = base('hrv');
  if (t.hrv && hb){

const shortD = s => `${parseD(s).getUTCDate()}. ${MON[parseD(s).getUTCMonth()]}`;
function axisLabels(w){
  if (!w.length) return '';

  const idx = FR.key === '1y' ? [0, Math.round(n/3), Math.round(2*n/3), n] : [0, Math.round(n/2), n];
  const lab = i => i === n ? 'Heute' : FR.key === '1y' ? MON[parseD(w[i].id).getUTCMonth()] : shortD(w[i].id);
  return `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--lilac);margin-top:4px">${idx.map(i=>`<span>${lab(i)}</span>`).join('')}</div>`;
}
function chartWrap(svg, id){
  return `<div class="scrub" data-scrub="${id}" style="position:relative;touch-action:pan-y;cursor:crosshair">${svg}
    <div class="scrubline" style="display:none;position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.7;pointer-events:none"></div></div>`;
}
function viewForm(){
  const w = rangeData();
  const f = formInfo();
  const W = 350, H = 140;
  const X = i => i / Math.max(1, w.length-1) * W;
  const vals = w.flatMap(x => [x.ctl, x.atl]);
  const minV = Math.max(0, Math.min(...vals) - 5), maxV = Math.max(...vals) + 5;
  const Y = v => H - ((v - minV) / (maxV - minV)) * H;
  const line = (k, c) => `<polyline fill="none" stroke="${c}" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${w.map((x,i)=>`${X(i).toFixed(1)},${Y(x[k]).toFixed(1)}`).join(' ')}"></polyline>`;
  const lo = -40, hi = 25;
  const Yp = v => H - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * H;
  const bands = [['fresh',5,25],['grey',-10,5],['opt',-30,-10],['high',-40,-30]].map(([k,a,b]) => {
    const z = FORMZ.find(q => q.key === k);
    return `<rect x="0" y="${Yp(b)}" width="${W}" height="${Yp(a)-Yp(b)}" fill="${z.col}" fill-opacity="0.4"></rect>`;
  }).join('');
  const pctPts = w.map((x,i) => `${X(i).toFixed(1)},${Yp(x.ctl-x.atl).toFixed(1)}`).join(' ');
  const trend = f.ctl28 != null ? f.ctl - f.ctl28 : 0;
  const trendTxt = trend >= 2 ? `deine Fitness ist von ${f.ctl28} auf ${f.ctl} gestiegen` : trend <= -2 ? `deine Fitness ist von ${f.ctl28} auf ${f.ctl} leicht gesunken` : `deine Fitness ist mit ${f.ctl} etwa gleich geblieben`;
  let advice = '';
  if (trend <= -2) advice = 'Für einen Aufbau braucht es etwas mehr regelmäßigen Umfang, vor allem lockere Kilometer.';
  else if (trend >= 2) advice = 'Weiter so, der Aufbau greift.';
  else advice = 'Um fitter zu werden, darf die Belastung behutsam steigen, etwa 3 bis 4 Fitnesspunkte pro Woche.';
  const peak = w.reduce((a,x)=>x.ctl>a.ctl?x:a, w[0]);
  let h = topBar();
  h += `<h1>Deine Form</h1>`;
  h += `<section class="card" style="gap:10px"><div class="row"><span class="tag" style="background:${f.zone.col};color:var(--bg)">${f.zone.name}</span><span class="small" style="color:var(--soft)">Form ${f.tsb>0?'+':''}${f.tsb}</span></div>
    <p style="line-height:1.5">In den letzten vier Wochen ${trendTxt}. ${advice}</p>
    <p style="line-height:1.5;color:var(--soft)">${esc(todaySentence(f, plan().filter(e=>e.date===TODAY)))}</p></section>`;
  h += `<div class="seg" role="group" aria-label="Zeitraum">${RANGES.map(([k,l])=>`<button data-act="frange" data-v="${k}" aria-pressed="${FR.key===k}" class="${FR.key===k?'on':''}">${l}</button>`).join('')}</div>`;
  h += `<div class="scrubtip" id="scrubtip" aria-live="polite" style="display:none"></div>`;
  h += runBuildSection();
  h += `<section style="background:var(--bg2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px">
    <h2>Form</h2>
    ${chartWrap(`<svg width="100%" height="140" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Verlauf der Form mit Bereichen" style="display:block">${bands}<polyline fill="none" stroke="#F1EAFF" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${pctPts}"></polyline></svg>`, 'form')}
    ${axisLabels(w)}
    <div class="legend">${['fresh','grey','opt','high'].map(k=>{const z=FORMZ.find(q=>q.key===k);return `<span><i style="background:${z.col}"></i>${z.name}</span>`;}).join('')}</div>
    <p class="small" style="color:var(--soft);line-height:1.5"><b style="color:var(--text)">Form</b> = Fitness minus Ermüdung. Unter null heißt: Du trainierst gerade. Über null heißt: Du bist ausgeruht. Für Wettkämpfe willst du leicht im Plus sein.</p></section>`;
  h += `<section style="background:var(--bg2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px">
    <h2>Fitness und Ermüdung</h2>
    ${chartWrap(`<svg width="100%" height="140" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Verlauf von Fitness und Ermüdung" style="display:block">${line('atl','#FF8A1F')}${line('ctl','#F1EAFF')}</svg>`, 'fit')}
    ${axisLabels(w)}
    <div class="legend"><span><i style="background:#F1EAFF"></i>Fitness ${f.ctl}</span><span><i style="background:#FF8A1F"></i>Ermüdung ${f.atl}</span>${FR.key!=='6w'?`<span>Höchststand ${Math.round(peak.ctl)} am ${shortD(peak.id)}</span>`:''}</div>
    <p class="small" style="color:var(--soft);line-height:1.5"><b style="color:var(--text)">Fitness</b> ist, was du dir über etwa sechs Wochen aufgebaut hast. Sie steigt langsam und fällt langsam.<br><b style="color:var(--text)">Ermüdung</b> ist die Belastung der letzten etwa sieben Tage. Sie springt nach harten Tagen hoch und fällt in Ruhephasen schnell.</p></section>`;
  const val = (label, cur, avg, unit, fmt, betterHigh) => {
    if (!cur) return `<div><p class="k">${label}</p><p class="v">–</p></div>`;
    const v = fmt(cur.v), a = avg ? fmt(avg) : null;
    let word = '';
    if (avg){ const d = (cur.v - avg) / avg; word = Math.abs(d) < 0.06 ? 'normal' : ((d > 0) === betterHigh ? 'besser als sonst' : 'schlechter als sonst'); }
    return `<div><p class="k">${label}</p><p class="v">${v}${unit}</p><p class="small muted">${word}${a?` · Ø ${a}${unit}`:''}${cur.day!==TODAY?' · gestern':''}</p></div>`;
  };
  h += `<h2>Erholung</h2><section class="form">
    ${val('HRV', f.hrv, f.hrvAvg, '', v=>Math.round(v), true)}
    ${val('Ruhepuls', f.rhr, f.rhrAvg, '', v=>Math.round(v), false)}

  return h + navBar('form');
}
// Antippen oder Ziehen im Diagramm: Linie und kleines Fenster mit Datum und Werten
function scrubAt(el, clientX){
  const w = rangeData(); if (!w.length) return;
  const r = el.getBoundingClientRect();
  const t = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  const i = Math.round(t * (w.length-1)), x = w[i];
  const px = i / Math.max(1, w.length-1);
  document.querySelectorAll('.scrub').forEach(s => { const l = s.querySelector('.scrubline'); l.style.display='block'; l.style.left = `calc(${(px*100).toFixed(2)}% - 1px)`; });
  const tsb = Math.round(x.ctl - x.atl), z = FORMZ.find(q => tsb >= q.min);
  const tip = document.getElementById('scrubtip');
  tip.style.display = 'flex';
  tip.innerHTML = `<b>${x.id===TODAY?'Heute':`${WD[wd(x.id)]}, ${shortD(x.id)}`}</b><span>Fitness <b>${Math.round(x.ctl)}</b></span><span>Ermüdung <b>${Math.round(x.atl)}</b></span><span>Form <b style="color:${z.col}">${tsb>0?'+':''}${tsb}</b></span>`;
}
function scrubEnd(){
  document.querySelectorAll('.scrubline').forEach(l => l.style.display = 'none');
  const tip = document.getElementById('scrubtip'); if (tip) tip.style.display = 'none';
}
let scrubbing = null;
document.addEventListener('pointerdown', e => { const s = e.target.closest('.scrub'); if (!s) return; scrubbing = s; scrubAt(s, e.clientX); });
document.addEventListener('pointermove', e => { if (scrubbing) scrubAt(scrubbing, e.clientX); });
document.addEventListener('pointerup', () => { if (scrubbing){ scrubbing = null; setTimeout(scrubEnd, 1500); } });
document.addEventListener('pointercancel', () => { scrubbing = null; scrubEnd(); });
document.addEventListener('click', e => { const b = e.target.closest('[data-act="frange"]'); if (b){ FR.key = b.dataset.v; render(); } });

function flatSteps(steps){ return flatten(steps); }
function libWorkout(t, l = 1, scaleWu = 1){
  const main = t.main(l);
  const steps = [];
  if (t.wu) steps.push(WU(t.wu * scaleWu));
  steps.push(...main);
  if (t.cd) steps.push(CD(t.cd * scaleWu));
  return steps;
}
const durOf = steps => flatSteps(steps).reduce((a,s)=>a+(s.duration||0),0);
const loadOf = steps => Math.round(estLoad(flatSteps(steps)));
// Workout auf eine Wunschdauer bringen: Stufe wählen, dann Ein-/Auslaufen bzw. Grundlage anpassen
function fitWorkout(t, minutes, maxLvl = 2){
  const target = minutes * 60;
  let best = null;
  for (const l of [2,1,0].filter(x => x <= maxLvl)){
    const core = durOf(t.main(l));
    const minWrap = ((t.wu ? 10 : 0) + (t.cd ? 5 : 0)) * 60;
    if (core + minWrap <= target + 60 || l === 0){ best = l; break; }
  }
  const main = t.main(best);
  const core = durOf(main);
  let left = Math.max(0, target - core);
  const steps = [];
  if (!t.wu && !t.cd){
    // reine Dauerläufe: Hauptteil auf die Dauer strecken
    const f = flatSteps(main);
    if (f.length === 1) return { steps:[Object.assign({}, f[0], { duration: Math.max(600, target) })], level:best };
  }
  let wu = t.wu ? Math.min(Math.max(600, left * 0.6), 20*60) : 0;
  let cd = t.cd ? Math.min(Math.max(300, left - wu), 15*60) : 0;
  const extra = Math.max(0, left - wu - cd);
  if (t.wu) steps.push(Object.assign(WU(0), { duration: Math.round(wu/30)*30 }));
  steps.push(...main);
  if (extra >= 300) steps.push(EASY(Math.round(extra/60), 'Locker'));
  if (t.cd) steps.push(Object.assign(CD(0), { duration: Math.round(cd/30)*30 }));
  // Passt selbst die Einstiegsstufe nicht, werden die lockeren Teile gestaucht (harte bleiben gleich)
  let flat = flatSteps(steps);
  const total = flat.reduce((a,x)=>a+x.duration,0);
  if (total > target + 60){
    const easySum = flat.filter(x => stepPct(x) < 90 && x.duration >= 120).reduce((a,x)=>a+x.duration,0);
    const hardSum = total - easySum;
    const f = Math.max(0.3, (target - hardSum) / Math.max(1, easySum));
    flat = flat.map(x => (stepPct(x) < 90 && x.duration >= 120) ? Object.assign({}, x, { duration: Math.max(60, Math.round(x.duration * f / 30) * 30) }) : x);
    return { steps: flat, level: best };
  }
  return { steps, level:best };
}

const fmtTime = sec => { sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}:${d2(m)}:${d2(s)}` : `${m}:${d2(s)}`; };
const parseTime = t => { const p = (t||'').trim().split(':').map(Number); if (!p.length || p.some(isNaN)) return null; return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p.length===2 ? p[0]*60+p[1] : null; };
function predictTime(dk){ const d = DISTS[dk]; return d.km*1000 / (THR * d.speed); }
function otherLoadPerWeek(){

function runMinutesPerWeek(){

const PEAK_MIN = { '5k':210, '10k':240, 'hm':300, 'm':390 };
const DAYF = { 2:0.7, 3:0.8, 4:0.9, 5:1, 6:1.1 };
const LONG = { '5k':[50,80], '10k':[60,95], 'hm':[70,120], 'm':[90,180] };
const WD7 = ['Mo','Di','Mi','Do','Fr','Sa','So'];
// Lauftage verteilen: alle Kombinationen durchprobieren, harte Tage nie direkt nebeneinander oder neben dem langen Lauf
function assignDays(sessions, anchor, raceWeek){
  const anc = sessions.find(s => s.anchor), rest = sessions.filter(s => !s.anchor);
  const hard = rest.filter(s => s.hard), easy = rest.filter(s => !s.hard);
  const pool = [0,1,2,3,4,5,6].filter(d => d !== anchor && (!raceWeek || d < anchor));
  const need = Math.min(rest.length, pool.length);
  const dist = (a,b) => { const x = Math.abs(a-b); return raceWeek ? x : Math.min(x, 7-x); };
  let best = null;
  const combos = (arr, k, start = 0, cur = []) => { if (cur.length === k) return [cur.slice()]; let o = []; for (let i = start; i < arr.length; i++){ cur.push(arr[i]); o = o.concat(combos(arr, k, i+1, cur)); cur.pop(); } return o; };
  const nH = Math.min(hard.length, need);
  for (const set of combos(pool, need)){
    for (const hs of combos(set, nH)){
      let sc = 0;
      const all = [anchor, ...set].sort((x,y)=>x-y);
      for (let i = 0; i < all.length - (raceWeek ? 1 : 0); i++){ const g = dist(all[i], all[(i+1) % all.length]); if (g === 1) sc += 1; }
      hs.forEach((h, i) => {
        if (raceWeek) sc += Math.abs(anchor - 2 - h) * 3;
        else if (dist(h, anchor) === 1) sc += 10;
        hs.slice(i+1).forEach(h2 => { if (dist(h, h2) === 1) sc += 10; });
      });
      if (!best || sc < best.sc) best = { sc, set, hs };
    }
  }
  if (anc) anc.di = anchor;
  if (best){
    const hs = [...best.hs], es = best.set.filter(d => !hs.includes(d));
    hard.slice(0, nH).forEach(s => s.di = hs.shift());
    [...hard.slice(nH), ...easy].forEach(s => { s.di = es.length ? es.shift() : null; });
  }
  for (let i = sessions.length - 1; i >= 0; i--) if (sessions[i].di == null) sessions.splice(i, 1);
  sessions.forEach(s => s.day = WD7[s.di]);
  sessions.sort((a,b) => a.di - b.di);
}
function buildPlan(g){
  const d = DISTS[g.dist];
  const start = addDays(monday(TODAY), 7); // Start: nächster Montag
  const race = g.date;
  const weeks = Math.floor((parseD(race) - parseD(start)) / 864e5 / 7) + 1;
  if (weeks < 2) return { error:'Das Renndatum liegt zu nah für einen eigenen Plan.' };
  const f = formInfo(), ctl0 = f.ctl;
  const warn = [];
  const taper = Math.min(d.taper, weeks-1);
  const build = weeks - taper;
  const startMin = Math.max(90, runMinutesPerWeek());
  const peak = Math.round(PEAK_MIN[g.dist] * DAYF[g.days]);
  // Umfang steigt höchstens 10 % pro Woche (ohne Erholungswochen)
  const steps = Math.max(1, build - Math.floor(build/4) - 1);
  let growth = Math.pow(peak / startMin, 1/steps) - 1;
  if (weeks < d.minW) warn.push({ lvl:'r', t:`Sehr knapp: Für ${d.name} sind mindestens ${d.minW} Wochen Vorbereitung sinnvoll, du hast ${weeks}.` });
  if (growth > 0.12) warn.push({ lvl:'r', t:`Zu steil: Dein Laufumfang müsste um ${Math.round(growth*100)} % pro Woche steigen, von ${fmtH(startMin)} auf ${fmtH(peak)}. Sicher sind etwa 10 %. Ich deckele das, du startest dann mit weniger Umfang ins Rennen als ideal.` });
  else if (growth > 0.10) warn.push({ lvl:'y', t:`Ambitioniert: ${Math.round(growth*100)} % mehr Laufumfang pro Woche liegen knapp über den empfohlenen 10 %. Achte besonders auf Erholung.` });
  growth = Math.min(growth, 0.10);
  if (g.dist === 'm' && g.days === 2) warn.push({ lvl:'r', t:'Zwei Lauftage reichen für einen Marathon nicht sicher aus. Der lange Lauf müsste fast den ganzen Umfang tragen, das Verletzungsrisiko steigt deutlich. Nimm mindestens einen dritten Tag dazu.' });
  else if (g.dist === 'm' && g.days < 4) warn.push({ lvl:'y', t:'Für einen Marathon sind vier oder mehr Lauftage pro Woche deutlich besser. Mit drei Tagen wird der lange Lauf sehr lang.' });
  if (g.dist === 'hm' && g.days === 2) warn.push({ lvl:'y', t:'Mit zwei Lauftagen kommst du gut ins Ziel, für eine Zielzeit fehlt aber Umfang. Rad oder Kraft an anderen Tagen helfen, die Grundlage aufzubauen.' });
  const pred = predictTime(g.dist), goal = parseTime(g.time);
  if (goal){
    const gap = (pred - goal) / pred * 100;
    if (gap > 8) warn.push({ lvl:'r', t:`Zielzeit ${fmtTime(goal)} liegt ${Math.round(gap)} % unter deiner aktuellen Prognose von ${fmtTime(pred)}. Das ist in ${weeks} Wochen kaum realistisch.` });
    else if (gap > 4) warn.push({ lvl:'y', t:`Zielzeit ${fmtTime(goal)} ist ambitioniert: Deine aktuelle Prognose liegt bei ${fmtTime(pred)}. Machbar, wenn das Training gut läuft.` });
  }
  const other = otherLoadPerWeek();
  const perMinEasy = 100*Math.pow(0.84,2)/60;
  const out = [];
  let ctl = ctl0, vol = startMin, maxRamp = 0;
  for (let i = 0; i < weeks; i++){
    const wStart = addDays(start, i*7);
    const isRace = i === weeks-1;
    let phase;
    if (i >= build) phase = 'Tapering';
    else if (i < Math.round(build*0.4)) phase = 'Grundlage';
    else if (i < Math.round(build*0.8)) phase = 'Aufbau';
    else phase = 'Spitze';
    const recovery = phase !== 'Tapering' && (i+1) % 4 === 0;
    if (!recovery && phase !== 'Tapering' && i > 0) vol = Math.min(peak, vol * (1 + growth));
    let wMin = recovery ? vol * 0.75 : vol;
    if (phase === 'Tapering') wMin = vol * (isRace ? 0.5 : 0.7);
    wMin = Math.round(wMin / 5) * 5;
    // Qualitätseinheiten
    const q = [];
    if (phase === 'Grundlage') q.push('GRU-4');
    if (phase === 'Aufbau') q.push(pickId(d.keyB, i), pickId(d.keyA, i));
    if (phase === 'Spitze') q.push(pickId(d.keyB, i), g.dist==='m'||g.dist==='hm' ? 'WET-3' : 'WET-2');
    if (phase === 'Tapering') q.push(isRace ? 'WET-1' : pickId(d.keyB, i));
    const nQ = Math.min(q.length, Math.max(1, g.days - 2) + (isRace && g.days > 2 ? 1 : 0));
    const qSessions = q.slice(0, nQ).map(id => { const t = LIB.find(x=>x.id===id); const st_ = libWorkout(t, recovery || phase==='Tapering' ? 0 : 1); return { name:t.name, min:mins(durOf(st_)), load:loadOf(st_), col:CATS.find(c=>c.key===t.cat).col, hard:t.cat!=='erholung'&&t.cat!=='grundlage' }; });
    const sessions = [...qSessions];
    let rest = wMin - qSessions.reduce((a,s)=>a+s.min,0);
    if (!isRace){
      const [lo, hi] = LONG[g.dist];
      const prog = Math.min(1, i / Math.max(1, build-1));
      let longMin = lo + (hi-lo) * prog;
      if (recovery) longMin *= 0.8;
      if (phase==='Tapering') longMin = lo * 0.8;
      longMin = Math.round(Math.min(longMin, wMin * (g.days === 2 ? 0.6 : 0.42)) / 5) * 5;
      sessions.push({ name:'Langer Lauf', min:longMin, load:Math.round(longMin*perMinEasy), col:'#FFD84D', anchor:true });
      rest -= longMin;
    }
    const nEasy = g.days - sessions.length - (isRace ? 1 : 0);
    // Lockere Läufe nie länger als ¾ des langen Laufs (max. 75 min); übriger Umfang geht in den langen Lauf, bis zu dessen Obergrenze
    const longS = sessions.find(x => x.name === 'Langer Lauf');
    let easyCap = longS ? Math.min(75, longS.min * 0.75) : 75;
    if (longS && !recovery && phase !== 'Tapering' && nEasy > 0 && rest / nEasy > easyCap){
      const extra = Math.min(rest - easyCap * nEasy, Math.max(0, Math.min(LONG[g.dist][1], longS.min + 15) - longS.min));
      longS.min = Math.round((longS.min + extra) / 5) * 5; longS.load = Math.round(longS.min * perMinEasy);
      rest -= extra; easyCap = Math.min(75, longS.min * 0.75);
    }
    for (let k = 0; k < nEasy; k++){
      const m = Math.max(30, Math.round(Math.min(rest / nEasy, easyCap) / 5) * 5);
      sessions.push({ name:'Lockerer Lauf', min:m, load:Math.round(m*perMinEasy), col:'#FFD84D' });
    }
    if (isRace) sessions.push({ name:`Rennen: ${d.name}`, min:Math.round(pred/60), load:Math.round(pred/60*1.5), col:'#D7FF3D', anchor:true });
    assignDays(sessions, isRace ? (parseD(race).getUTCDay()+6)%7 : Math.max(0, WD7.indexOf(g.long)), isRace);
    const totMin = sessions.reduce((a,s)=>a+s.min,0);
    const load = sessions.reduce((a,s)=>a+s.load,0) + other;
    const prev = ctl;
    ctl = ctl + (load/7 - ctl) * (1 - Math.exp(-7/42));
    maxRamp = Math.max(maxRamp, ctl - prev);
    const long = sessions.find(s=>s.name==='Langer Lauf');
    if (long && long.min > totMin*0.4 && !warn.some(w=>w.k==='long')) warn.push({ k:'long', lvl:'y', t:'In manchen Wochen macht der lange Lauf mehr als 40 % deiner Laufzeit aus. Ein Lauftag mehr würde das entzerren.' });
    out.push({ i, wStart, phase, recovery, load: Math.round(load), ctl:Math.round(ctl), sessions, totMin });
  }
  if (maxRamp > 6) warn.push({ lvl:'r', t:`In einzelnen Wochen steigt deine Fitness um bis zu ${maxRamp.toFixed(1)} Punkte. Mehr als etwa 5 pro Woche erhöht das Verletzungsrisiko deutlich.` });
  const target = Math.round(d.ctl * (0.75 + g.days * 0.0625));
  const ctlEnd = Math.round(out[out.length-1].ctl);
  if (ctlEnd < target - 8) warn.push({ lvl:'y', t:`Am Renntag liegt deine Fitness voraussichtlich bei ${ctlEnd}, für ${d.name} wären etwa ${target} ideal. Das Ziel ist trotzdem schaffbar, aber eher zum Ankommen als für eine Bestzeit.` });
  return { weeks: out, warn, target, ctlEnd, ctl0, pred, goal, other, d, race, startMin, peak };
}

/* ---------- Tagesschalter "Läuft." ---------- */
// An, sobald das heutige Training erledigt ist. Ruhetage sind automatisch an.
function dayDone(day){
  const evs = plan().filter(e => e.date === day);
  if (!evs.length) return { rest:true, done:true };
  return { rest:false, done: evs.every(e => statusOf(e).s === 'done'), evs };
}
function dayStatus(){
  const d = dayDone(TODAY);
  if (d.rest) return { on:true, label:'Läuft.', sub:'Ruhetag. Erholung gehört zum Plan.' };
  if (d.done) return { on:true, label:'Läuft.', sub:'Heute erledigt. Stark.' };
  const ev = d.evs.find(e => statusOf(e).s !== 'done');
  return { on:false, label:`Heute: ${ev.cat.name} · ${mins(ev.dur)} min`, sub:'' };
}
function streakDays(){
  let n = dayDone(TODAY).done ? 1 : 0;
  for (let i = 1; i < 60; i++){
    const day = addDays(TODAY, -i);
    const first = SNAP.events.map(e=>dateOf(e.start_date_local)).sort()[0];
    if (!first || day < first) break; // nur Tage, für die ein Plan vorliegt
    if (!dayDone(day).done) break;
    n++;
  }
  return n;
}

/* ---------- Automatisch umplanen ---------- */
// Verpasste Schlüsseleinheit dieser Woche auf einen späteren lockeren Tag legen, wenn das sicher geht.
function autoReplan(){
  const mon = monday(TODAY), sun = addDays(mon, 6);
  const f = formInfo();
  const all = plan();
  for (const ev of all){
    if (ev.date < mon || ev.date >= TODAY || !ev.cat.key || !ev.cat.hard) continue;
    if (statusOf(ev).s !== 'missed') continue;
    if (ST.auto[ev.id] !== undefined) continue;
    if (ST.unfit[ev.date]) { ST.auto[ev.id] = { none:true, reason:'unfit' }; continue; }
    const hardOn = day => plan().some(e => e.id !== ev.id && e.date === day && e.cat.hard && statusOf(e).s !== 'missed');
    const doneHard = day => activitiesOn(day).some(a => isRun(a.type) && (a.icu_training_load||0) >= 55);
    const cands = plan().filter(e => e.date >= TODAY && e.date <= sun && isRun(e.type) && !e.cat.hard && statusOf(e).s !== 'done' && !ST.variants[e.id]);
    let pick = null;
    for (const c of cands){
      const prev = addDays(c.date, -1), next = addDays(c.date, 1);
      if (hardOn(prev) || hardOn(next) || doneHard(prev)) continue;
      if (f.zone.key === 'high' && c.date <= addDays(TODAY, 1)) continue; // müde: nicht sofort hart
      pick = c; break;
    }
    if (pick && isOwn(ev.raw) && isOwn(pick.raw)){
      ST.moves[ev.id] = pick.date;
      ST.removed[pick.id] = 'auto';
      ST.auto[ev.id] = { to: pick.id, from: ev.date, day: pick.date, name: ev.name, easy: pick.name };
    } else if (pick){
      // Fremde Trainings fasst die Automatik nicht an: nur ein Vorschlag
      ST.auto[ev.id] = { suggest:true, to: pick.id, from: ev.date, day: pick.date, name: ev.name, easy: pick.name, src: sourceOf(ev.raw) };
    } else {
      ST.auto[ev.id] = { none:true, from: ev.date, name: ev.name };
    }
    save();
  }
}

const DRAG = { timer:null, start:null, el:null, ghost:null, ev:null, over:null, active:false, justDragged:false, raf:null, y:0 };

function startDrag(x, y){

  if (DRAG.over && DRAG.over !== day) DRAG.over.classList.remove('drop-g','drop-y','drop-r');

  if (day && day.dataset.day >= TODAY){
    const d = day.dataset.day;
    const c = d === DRAG.ev.date ? {c:'g'} : conflict(DRAG.ev, d);

}
function autoScroll(){
  if (!DRAG.active) return;

  else if (DRAG.y > H - edge - 70) window.scrollBy(0, Math.ceil((DRAG.y - (H - edge - 70)) / 6));
  DRAG.raf = requestAnimationFrame(autoScroll);
}
document.addEventListener('pointermove', e => {

/* ---------- Laufaufbau: Kilometer der letzten 7 Tage im Soll-Band (nur Läufe) ---------- */
// Soll-Band: 0,8- bis 1,3-fache deines Wochenschnitts der letzten 4 Wochen. Nach vorn mit den geplanten Läufen.
function runKmOn(day){ return SNAP.activities.filter(a => isRun(a.type) && dateOf(a.start_date_local) === day).reduce((x,a)=>x+(a.distance||0)/1000,0); }
function stepsKm(steps){ return steps.reduce((x,s)=>x + (s.duration||0) * THR * (s.pace ? stepPct(s) : 75) / 100 / 1000, 0); }
function plannedKmOn(day){ return plan().filter(e => e.date === day && isRun(e.type) && statusOf(e).s !== 'done').reduce((x,e)=>x + (e.steps.length ? stepsKm(e.steps) : (e.raw.distance||0)/1000), 0); }
function runSeries(){
  const days = RANGES.find(r => r[0] === FR.key)[2];
  const ahead = 14;
  const from = addDays(TODAY, -days + 1), to = addDays(TODAY, ahead);
  const daily = {};
  for (let d = addDays(from, -28); d <= to; d = addDays(d, 1)) daily[d] = d < TODAY ? runKmOn(d) : runKmOn(d) + plannedKmOn(d);
  const sum = (d, n) => { let x = 0; for (let i = 0; i < n; i++) x += daily[addDays(d, -i)] || 0; return x; };
  const out = [];
  for (let d = from; d <= to; d = addDays(d, 1)){
    const km = FR.key === '1y' ? sum(d, 14) / 2 : sum(d, 7), chronic = sum(d, 28) / 4; // 1 Jahr: über 2 Wochen gemittelt, ruhiger
    out.push({ d, km, chronic, lo: chronic * 0.8, hi: chronic * 1.3, future: d > TODAY });
  }
  const step = FR.key === '1y' ? 7 : FR.key === '3m' ? 3 : 2;
  const iT = out.findIndex(p => p.d === TODAY);
  return out.filter((p, i) => i === iT || i === 0 || i === out.length - 1 || Math.abs(i - iT) % step === 0);
}
// Weiche Kurve durch Punkte (Catmull-Rom als Bézier)
function smoothPath(pts){
  if (pts.length < 2) return '';
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6], c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function kmTrend(){
  let a = 0, b = 0;
  for (let i = 0; i < 28; i++){ a += runKmOn(addDays(TODAY, -i)); b += runKmOn(addDays(TODAY, -28 - i)); }
  return { now: a, before: b, pct: b > 0 ? Math.round((a - b) / b * 100) : null };
}
const kmStr = v => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
function runBuildSection(){
  const S = runSeries(); if (S.length < 2) return '';
  const W = 350, H = 130;
  const max = Math.max(5, ...S.map(p => Math.max(p.km, p.hi))) * 1.12;
  const X = i => i / (S.length - 1) * W, Y = v => H - 6 - v / max * (H - 12);
  const iT = S.findIndex(p => p.d === TODAY);
  const hiPts = S.map((p,i) => [X(i), Y(p.hi)]), loPts = S.map((p,i) => [X(i), Y(p.lo)]);
  const band = `<path d="${smoothPath(hiPts)} L${X(S.length-1)} ${Y(S[S.length-1].lo)} ${smoothPath(loPts.slice().reverse()).replace(/^M/,'L')} Z" fill="#5ED68A" fill-opacity="0.8"></path>`;
  const past = S.slice(0, iT + 1).map((p,i) => [X(i), Y(p.km)]);
  const fut = S.slice(iT).map((p,i) => [X(i + iT), Y(p.km)]);
  const line = `<path d="${smoothPath(past)}" fill="none" stroke="#F1EAFF" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
    <path d="${smoothPath(fut)}" fill="none" stroke="#F1EAFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" vector-effect="non-scaling-stroke"></path>`;

function parseWorkouts(text){

      const w = JSON.parse(m[1]); const steps = [];
      const add = s => {
        const hr = Array.isArray(s.hr) ? s.hr : null, toP = v => +v > 110 ? bpmToPct(+v) : lthrToPct(+v); // bpm, sonst %LTHR
        const p = hr ? [toP(hr[0]), toP(hr[1] ?? hr[0])] : (s.pct || [80,88]);
        steps.push(Object.assign({ duration: Math.max(10, Math.round((s.min || 1) * 60)), pace:{ start:+p[0], end:+(p[1] ?? p[0]), units:'%pace' } }, hr ? { hrMode:true } : {}, s.text ? { text:s.text } : {}, s.kind === 'warmup' ? { warmup:true } : s.kind === 'cooldown' ? { cooldown:true } : {}));

    else out.push(`Bei ${paceStr(A.vAvg)} liegt dein Puls normal bei etwa ${norm}, heute ${now}. Das passt.`);
  }
  if (A.decoupling != null){
    const dc = Math.round(A.decoupling), n = A.decName ? `Im Abschnitt „${A.decName}“` : 'Im langen Abschnitt';
    if (dc < 5) out.push(`${n} blieb der Puls stabil (Entkopplung ${Math.max(0, dc)} %), sauber aerob.`);
    else if (dc <= 10) out.push(`${n} stieg der Puls um ${dc} % bei gleichem Tempo, gegen Ende wurde es anstrengender.`);
    else out.push(`${n} stieg der Puls deutlich (${dc} %), das war mehr als locker.`);
  }
  return out.slice(0, 4).join(' ');
}
function zonesHTML(A){
  if (!A) return '';
  const fmt = sec => `${Math.round(sec / 60)}′`;
  const bars = (ist, soll, name) => {
    const ti = ist.reduce((a, b) => a + b, 0), ts = soll.reduce((a, b) => a + b, 0); if (!ti) return '';
    const seg = (arr, t) => arr.map((v, i) => v ? `<div style="width:${(v / t * 100).toFixed(1)}%;background:${ZONES[i].hex}"></div>` : '').join('');
    return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px"><span style="font-weight:700;font-size:14px">${name}</span><span class="small muted">${ts ? 'Ist · Soll' : 'Ist · ohne Puls-Ziel'}</span></div>`
      + `<div style="display:flex;height:14px;border-radius:6px;overflow:hidden;margin-top:6px">${seg(ist, ti)}</div>`
      + (ts ? `<div style="display:flex;height:4px;border-radius:3px;overflow:hidden;margin-top:3px;opacity:.55">${seg(soll, ts)}</div>` : '')
      + `<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin-top:6px;font-size:11px;color:var(--lilac);text-align:center">${ist.map((v, i) => `<span>Z${i+1} ${fmt(v)}</span>`).join('')}</div>`;
  };
  return `<section style="background:var(--bg2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px">`
    + `<span class="small" style="letter-spacing:.06em;color:var(--lilac);font-weight:700;font-size:11px">ZONEN · SOLL UND IST</span>`
    + `<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:36px;font-weight:700;line-height:1">${Math.round(A.rate * 100)} %</span><span class="small muted">der Zeit im Zielbereich</span></div>`
    + bars(A.paceIst, A.paceSoll, 'Pace') + (A.hasHr ? bars(A.hrIst, A.hrSoll, 'Puls') : '')
    + `<p class="small muted" style="line-height:1.5;margin-top:6px">${esc(zoneSentence(A))}</p></section>`;
}

/* ---------- Sheets ---------- */
function openSheet(html){ closeSheet(); const d=document.createElement('div'); d.className='scrim'; d.id='scrim'; d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${html}</div>`; d.addEventListener('click',e=>{ if(e.target===d) closeSheet(); }); document.body.appendChild(d); }
function closeSheet(){ const s=$('#scrim'); if(s) s.remove(); }
function toast(t){ const o=document.createElement('div'); o.className='toast'; o.textContent=t; document.body.appendChild(o); setTimeout(()=>o.remove(),3200); }

function menuSheet(id){
  const ev = plan().find(e=>String(e.id)===String(id)); if(!ev) return;
  const st = statusOf(ev);
  let h = `<h2>${esc(ev.name)}</h2><p class="small muted">${nice(ev.date)} · ${ev.cat.name} · ${mins(ev.dur)} min</p>`;
  h += `<button class="btn" data-act="detail" data-id="${ev.id}">Details ansehen</button>`;
  if (st.s!=='done' && ev.date>=TODAY){
    h += `<button class="btn" data-act="move" data-id="${ev.id}">Verschieben</button>`;
    if (isRun(ev.type)) h += `<button class="btn" data-act="adjust" data-id="${ev.id}">Anpassen</button>`;
    if (ev.modified) h += `<button class="btn ghost" data-act="restore" data-id="${ev.id}">Original wiederherstellen</button>`;
    h += `<button class="btn ghost" data-act="remove" data-id="${ev.id}">Streichen</button>`;
  }
  openSheet(h);
}
function conflict(ev, day){
  // Ampel: rot = harte Einheit am selben Tag, gelb = harte Einheit am Vortag/Folgetag oder schon eine Einheit am Tag
  const others = plan().filter(e=>e.id!==ev.id);
  const on = others.filter(e=>e.date===day);
  const near = others.filter(e=>e.date===addDays(day,-1)||e.date===addDays(day,1));
  if (on.some(e=>e.cat.hard) && ev.cat.hard) return { c:'r', why:'Am selben Tag liegt schon eine harte Einheit.' };
  if (ev.cat.hard && near.some(e=>e.cat.hard)) return { c:'y', why:`Direkt daneben liegt ${near.find(e=>e.cat.hard).name}. Zwei harte Tage hintereinander erhöhen das Verletzungsrisiko.` };
  if (on.length) return { c:'y', why:`An dem Tag steht schon ${on[0].name}. Doppeltag möglich, aber anstrengend.` };
  return { c:'g', why:'Passt gut.' };
}
function unfitSheet(id){
  openSheet(`<h2>Heute nicht fit</h2><p class="small muted">Was ist los? Der Plan passt sich an.</p>
  <button class="btn" data-act="unfit-go" data-v="zeit" data-id="${id}">Wenig Zeit</button>
  <button class="btn" data-act="unfit-go" data-v="muede" data-id="${id}">Müde oder schlecht geschlafen</button>
  <button class="btn" data-act="unfit-go" data-v="krank" data-id="${id}">Krank oder Schmerzen</button>`);
}

/* ---------- Aktionen ---------- */
function setVariant(id, v){
  const ev0 = plan().find(e=>String(e.id)===String(id));
  const before = compTargets();
  if (ST.variants[id]===v) delete ST.variants[id]; else ST.variants[id]=v;
  const ev = plan().find(e=>String(e.id)===String(id));
  const c = compensate(ev);
  save(); closeSheet(); render();
  syncShapes([id, ...before, ...compTargets()]);
  if (c) toast(`Ausgleich: ${WD[wd(c.tgt.date)]} ${c.tgt.name} +${mins(c.extra)} min locker`);
  else if (ev.load < ev.baseLoad) toast('Angepasst. Der kleine Rest wird nicht nachgeholt, das ist okay.');
  else toast(ST.variants[id] ? `Angepasst: ${VARIANTS[v]}` : 'Zurückgesetzt');
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const { act, id, v, d } = b.dataset;
  if (act==='detail'){ closeSheet(); location.hash = `#detail-${id}`; }
  if (act==='menu') menuSheet(id);
  if (act==='variant') setVariant(id, v);
  if (act==='reset'){ const before = compTargets(); delete ST.variants[id]; compensate(plan().find(x=>String(x.id)===String(id))); save(); render(); toast('Zurückgesetzt'); syncShapes([id, ...before, ...compTargets()]); }
  if (act==='move') moveSheet(id);
  if (act==='moveto'){
    const ev = plan().find(x=>String(x.id)===String(id));
    const c = d===ev.date ? null : conflict(ev,d);
    if (c && c.c!=='g' && b.dataset.confirm!=='1'){ $('#mvhint').textContent = `${c.why} Nochmal tippen zum Bestätigen.`; document.querySelectorAll('.mv [data-confirm]').forEach(x=>x.dataset.confirm=''); b.dataset.confirm='1'; return; }
    if (d===dateOf(ev.raw.start_date_local)) delete ST.moves[id]; else ST.moves[id]=d;
    save(); closeSheet(); render(); toast(`Verschoben auf ${nice(d)}`);
    pushMove(id, d);
  }
  if (act==='remove'){
    if (LIVE && b.dataset.ok!=='1'){ openSheet(`<h2>Einheit streichen?</h2><p style="line-height:1.5">Sie wird auch aus Intervals und von deiner Uhr entfernt.</p><div class="grid2"><button class="btn ghost" data-act="dragno">Abbrechen</button><button class="btn" data-act="remove" data-ok="1" data-id="${id}" style="background:#FF6B6B;color:var(--bg)">Streichen</button></div>`); return; }
    ST.removed[id]=true; save(); closeSheet(); render(); toast('Gestrichen. Lockere Einheiten holen wir nicht nach.'); pushDelete(id); }
  if (act==='unfit') unfitSheet(id);
  if (act==='unfit-go'){
    ST.unfit[TODAY]=v;
    if (v==='zeit') setVariant(id,'kuerzer');
    if (v==='muede') setVariant(id,'leichter');
    if (v==='krank'){ ST.removed[id]=true; const all = plan().filter(x=>x.date>TODAY && x.date<=addDays(TODAY,2) && x.cat.hard); const hard = all.filter(x=>isOwn(x.raw)), foreign = all.filter(x=>!isOwn(x.raw)); hard.forEach(x=>ST.variants[x.id]='leichter'); save(); closeSheet(); render();
      toast(foreign.length ? `Heute Pause. ${foreign.map(x=>`${WD[wd(x.date)]} ${x.name}`).join(', ')} ist von ${sourceOf(foreign[0].raw)} – tipp es an, wenn du es entschärfen willst.` : 'Heute Pause. Die nächsten harten Einheiten sind entschärft.');
      pushDelete(id); syncShapes(hard.map(x=>String(x.id))); }
  }
  if (act==='feel'){ ST.feel[id]=v; save(); render(); toast('Danke, fließt in die nächste Woche ein.'); }
  if (act==='noop') toast('Liegt schon auf deiner Uhr.');
});

function render(){
  try { autoReplan(); } catch(e){}
  const h = location.hash.replace('#','') || 'heute';
  const m = h.match(/^([a-z]+)(?:-(\d+))?$/) || [null,'heute']; const r = m[1], id = m[2];
  const root = $('#root');
  const V = { woche:viewWeek, detail:()=>viewDetail(id), form:viewForm, workouts:viewWorkouts, gen:viewGenerated, bib:()=>viewLibrary(id), ziel:viewGoal, planvorschau:viewPlanPreview, coach:viewCoach, coachset:viewCoachSettings };
  root.innerHTML = `<main class="app">${(V[r]||viewToday)()}</main>`;
}
addEventListener('hashchange', ()=>{ closeSheet(); window.scrollTo(0,0); render(); });
function loginView(msg){
  return `<main class="app" style="justify-content:center;min-height:90vh">
    <div class="logo" style="font-size:32px;justify-content:center"><span>ON</span><span class="tog off" style="width:52px;height:30px;padding:4px"><i style="width:22px;height:22px"></i></span><span>TRACK</span></div>
    <form id="loginform" class="note" style="display:flex;flex-direction:column;gap:12px">
      <label class="small muted" style="display:flex;flex-direction:column;gap:6px">Zugangscode
        <input type="password" name="token" autocomplete="current-password" style="height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-family:inherit;font-size:16px"></label>
      <p class="small" style="color:#FF6B6B;min-height:18px" role="alert">${msg||''}</p>
      <button class="btn lime" type="submit">Los</button></form></main>`;
}
async function loadLive(token){
  const r = await fetch(`${CONFIG.apiBase}/api/snapshot`, { headers:{ Authorization:`Bearer ${token}` } });
  if (r.status === 401) return 'auth';
  if (!r.ok) return 'err';
  SNAP = await r.json(); TODAY = SNAP.today; THR = SNAP.settings.threshold_pace_ms;
  return 'ok';
}
async function init(){
  if (LIVE){
    let token = ''; try { token = localStorage.getItem('ontrack.token') || ''; } catch(e){}
    if (!token){ $('#root').innerHTML = loginView(); return; }
    $('#root').innerHTML = `<main class="app" style="justify-content:center;min-height:90vh;text-align:center"><p class="muted">Lade deine Daten …</p></main>`;
    let res = 'err';
    try { res = await loadLive(token); } catch(e){}
    if (res === 'auth'){ try { localStorage.removeItem('ontrack.token'); } catch(e){} $('#root').innerHTML = loginView('Der Zugangscode stimmt nicht.'); return; }
    if (res === 'err' && !SNAP.events.length){ $('#root').innerHTML = loginView('Server nicht erreichbar. Bitte später nochmal versuchen.'); return; }
    if (typeof aiStatus === 'function') aiStatus().then(() => render());
  }
  render();
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'loginform') return;
  e.preventDefault();
  const t = new FormData(e.target).get('token').trim();
  if (!t) return;
  try { localStorage.setItem('ontrack.token', t); } catch(e){}
  init();
});
init();
</script>
<script>
// Profil-Scrubber: antippen oder ziehen, Liste im Ablauf setzt die Linie, Tipp daneben blendet aus
(() => {
  let drag = null;
  const pillHTML = (b, left) => `<span style="position:absolute;top:-8px;left:${left}%;transform:translate(-50%,-100%);white-space:nowrap;background:var(--bg);border-radius:14px;padding:6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none"><span class="small" style="color:var(--lilac);font-weight:700">${b.name}</span><span style="color:${b.ok?'var(--lime)':'#FF8A1F'};font-weight:700;font-size:13px">${b.txt}</span></span>`;
  const mark = b => document.querySelectorAll('.steps [data-si]').forEach(row => {
    const si = Number(row.dataset.si), next = row.nextElementSibling && row.nextElementSibling.dataset.si != null ? Number(row.nextElementSibling.dataset.si) : 1e9;
    row.style.background = b && b.si >= si && b.si < next ? 'rgba(215,255,61,.10)' : '';
  });
  const place = (box, x, b) => {
    const cur = box.querySelector('#pfcur'), pill = box.querySelector('#pfpill');
    cur.style.display = 'block'; cur.style.left = x + '%';
    pill.innerHTML = pillHTML(b, Math.min(80, Math.max(20, x))); mark(b);
  };
  const hide = () => { const box = document.querySelector('[data-pf]'); if (!box) return; box.querySelector('#pfcur').style.display = 'none'; box.querySelector('#pfpill').innerHTML = ''; mark(null); };
  const show = (box, clientX) => {
    if (!PFB.length) return;
    const r = box.getBoundingClientRect(), x = Math.max(0, Math.min(100, (clientX - r.left) / r.width * 100));
    let b = PFB.find(q => x >= q.x0 && x <= q.x1);
    if (!b) b = PFB.reduce((m, q) => Math.abs((q.x0+q.x1)/2 - x) < Math.abs((m.x0+m.x1)/2 - x) ? q : m);
    place(box, x, b);
  };
  document.addEventListener('pointerdown', e => {
    const box = e.target.closest('[data-pf]');
    if (box){ drag = { box, id: e.pointerId }; show(box, e.clientX); return; }
    const row = e.target.closest('.steps [data-si]'), pbox = document.querySelector('[data-pf]');
    if (row && pbox && PFB.length){
      const si = Number(row.dataset.si), b = PFB.find(q => q.si >= si) || PFB[PFB.length-1];
      place(pbox, (b.x0 + b.x1) / 2, b);
      pbox.scrollIntoView({ block:'nearest', behavior:'smooth' });
      return;
    }
    if (!e.target.closest('#pfpill')) hide();
  });
  document.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id) show(drag.box, e.clientX); });
  const end = e => { if (drag && e.pointerId === drag.id) drag = null; };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
})();
</script>
<script>
// Sheets mit Wisch nach unten schließen (am Griff jederzeit, im Inhalt nur ganz oben)
(() => {
  let d = null;
  document.addEventListener('touchstart', e => {
    const sh = e.target.closest('.sheet'); if (!sh) return;
    if (e.target.closest('input, textarea, select, [data-pf], .catrow')) return;
    if (!e.target.closest('.grab') && sh.scrollTop > 0) return;
    d = { sh, y0: e.touches[0].clientY, x0: e.touches[0].clientX, t0: Date.now(), dy: 0, on: false };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!d) return;
    const dy = e.touches[0].clientY - d.y0, dx = e.touches[0].clientX - d.x0;
    if (!d.on){ if (Math.abs(dx) > Math.abs(dy) || dy < 6){ if (dy < -6 || Math.abs(dx) > 10) d = null; return; } d.on = true; d.sh.style.transition = 'none'; }
    d.dy = Math.max(0, dy);
    d.sh.style.transform = `translateY(${d.dy}px)`;
    const scrim = document.getElementById('scrim'); if (scrim) scrim.style.background = `rgba(0,0,0,${Math.max(0, .55 - d.dy / 600)})`;
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', () => {
    if (!d) return;
    const { sh, dy, t0, on } = d; d = null; if (!on) return;
    const fast = dy / Math.max(1, Date.now() - t0) > 0.6;
    sh.style.transition = 'transform .22s ease';
    if (dy > 110 || (fast && dy > 40)){ sh.style.transform = `translateY(${sh.offsetHeight + 40}px)`; setTimeout(closeSheet, 200); }
    else { sh.style.transform = ''; const scrim = document.getElementById('scrim'); if (scrim) scrim.style.background = ''; }
  });
})();
</script>
