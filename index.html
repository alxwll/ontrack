<!DOCTYPE html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --bg:#2A0F5C; --bg2:#3A1A78; --card:#6D28FF; --line:#4B2A8A;
  --lilac:#C9B6FF; --soft:#E4D9FF; --text:#F1EAFF; --lime:#D7FF3D;
  --z1:#C9B6FF; --z2:#FFD84D; --z3:#FF8A1F; --z4:#FF3B3B; --z5:#E838A8; --str:#9B8AD9;
  --display:'Archivo',system-ui,sans-serif; --sans:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--lime)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 20px 96px;display:flex;flex-direction:column;gap:18px}
.preview{font-size:12px;color:var(--lilac);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;line-height:1.4}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.5px}
.tog{width:28px;height:16px;border-radius:99px;background:var(--lime);display:flex;justify-content:flex-end;padding:2px}
.tog i{width:12px;height:12px;border-radius:99px;background:var(--bg);display:block}
.tog.off{background:var(--line);justify-content:flex-start}.tog.off i{background:var(--lilac)}
.muted{color:var(--lilac)} .small{font-size:13px} p{margin:0}
h1,h2{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase}
h1{font-size:28px;line-height:1.05} h2{font-size:16px;letter-spacing:1px}
.status{display:flex;flex-direction:column;gap:8px}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:99px;font-family:var(--display);font-weight:900;font-size:28px;line-height:1.1}
.pill.on{background:var(--lime);color:var(--bg)} .pill.off{background:var(--line);color:var(--text);font-size:20px;padding:10px 16px}
.card{background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tag{align-self:flex-start;padding:6px 12px;border-radius:99px;background:var(--bg);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stats{display:flex;gap:24px}.stats .k{font-size:13px;color:var(--soft)}.stats .v{font-size:22px;font-weight:700}
.prof{display:block;background:var(--bg);border-radius:16px;padding:12px 12px 8px;color:var(--lilac);text-decoration:none;border:none;width:100%;text-align:left}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{height:48px;border-radius:14px;border:none;background:var(--bg);color:var(--text);font-size:15px;font-weight:700}
.btn.ghost{background:transparent;border:2px solid var(--lilac);color:var(--lilac)}
.btn.lime{background:var(--lime);color:var(--bg)}
.btn.sel{outline:2px solid var(--lime);color:var(--lime)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--bg);font-size:13px;font-weight:700;color:var(--lime);border:none}
.note{background:var(--bg2);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.5;color:var(--soft)}
.note b{color:var(--text)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--lime)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:13px}
.days span.d{width:14px;height:14px;border-radius:99px;display:inline-block}
.list{display:flex;flex-direction:column;gap:10px}
.wday{display:flex;flex-direction:column;gap:6px}
.wday .lbl{font-size:13px;color:var(--lilac);font-weight:700}
.wday .lbl.today{color:var(--lime)}
.ev{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:16px;padding:12px 14px;border:none;color:var(--text);text-align:left;width:100%}
.ev .stripe{width:6px;align-self:stretch;border-radius:3px;flex:none}
.ev .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.ev .n{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .m{font-size:13px;color:var(--lilac)}
.ev.done{opacity:.75}.ev.missed .n{text-decoration:line-through;color:var(--lilac)}
.ev .st{font-size:12px;font-weight:700;flex:none}
.empty{font-size:13px;color:var(--line);padding:4px 2px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom))}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav a{height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--lilac);text-decoration:none;font-weight:700}
.nav a.act{background:var(--line);color:var(--text)}
.back{display:flex;align-items:center;gap:6px;color:var(--lilac);text-decoration:none;font-weight:700;height:44px}
.steps .s{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps .s:last-child{border-bottom:none}
.steps .s .c{width:6px;height:36px;border-radius:3px;flex:none}
.steps .s .x{flex:1}.steps .s .x b{display:block;font-size:15px}.steps .s .x span{font-size:13px;color:var(--lilac)}
.steps .s .dur{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.scrim{position:fixed;inset:0;background:rgba(10,0,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.mv{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mv button{height:64px;border-radius:12px;border:none;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--bg)}
.mv .g{background:#7CE38B}.mv .y{background:#FFC857}.mv .r{background:#FF6B6B}.mv .x{background:var(--line);color:var(--lilac)}
.mv .cur{outline:3px solid var(--text)}
.hint{font-size:13px;color:var(--soft);min-height:20px;line-height:1.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:16px;background:var(--lime);color:var(--bg);font-weight:700;padding:12px 18px;border-radius:14px;z-index:30;max-width:90vw;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.weekhead{display:flex;align-items:center;justify-content:space-between}
.weekhead button{height:44px;min-width:44px;border-radius:12px;border:none;background:var(--bg2);color:var(--text);font-weight:700;padding:0 12px}
.form{display:flex;gap:10px}
.form > div{flex:1;background:var(--bg2);border-radius:16px;padding:12px 14px}
.form .k{font-size:12px;color:var(--lilac)}.form .v{font-size:20px;font-weight:700}
.fb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fb button{height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--lilac);font-weight:700}
.fb button.sel{border-color:var(--lime);color:var(--lime)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--lilac);font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
.seg button.on{background:var(--lime);border-color:var(--lime);color:var(--bg)}
.scrubtip{position:sticky;top:8px;z-index:5;gap:12px;flex-wrap:wrap;align-items:center;background:var(--text);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ev[data-id]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;transform-origin:center;box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:.95;border-radius:16px}
.ev.lifted{opacity:.3}
.wday.drop-g{outline:2px dashed #7CE38B;outline-offset:4px;border-radius:12px}
.wday.drop-y{outline:2px dashed #FFC857;outline-offset:4px;border-radius:12px}
.wday.drop-r{outline:2px dashed #FF6B6B;outline-offset:4px;border-radius:12px}
.weeksep{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 0 8px;display:flex;flex-direction:column;gap:6px}
.mvweek{display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<div id="root"></div>
<script id="snapshot" type="application/json">{"today": "2026-11-13", "settings": {"threshold_pace_ms": 3.5, "lthr": 170}, "events": [], "activities": [], "wellness": [], "streams": {}}</script>
<script>
"use strict";
/* ---------- Konfiguration ---------- */
const CONFIG = { apiBase: "https://ontrack.x-sall.workers.dev" }; // später: URL des Cloudflare Workers, z. B. "https://ontrack.<name>.workers.dev"

/* ---------- Daten ---------- */
let SNAP = JSON.parse(document.getElementById('snapshot').textContent);
const store = (() => { try { const k='ontrack.v1'; return { get:()=>JSON.parse(localStorage.getItem(k)||'{}'), set:v=>localStorage.setItem(k,JSON.stringify(v)) }; } catch(e){ return { get:()=>({}), set:()=>{} }; } })();
const ST = Object.assign({ moves:{}, variants:{}, removed:{}, comp:{}, feel:{}, auto:{}, unfit:{}, orig:{} }, store.get());
const save = () => { try { store.set(ST); } catch(e){} };

let TODAY = SNAP.today;
let THR = SNAP.settings.threshold_pace_ms; // m/s an der Schwelle
const LIVE = !!CONFIG.apiBase;

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d2 = n => String(n).padStart(2,'0');
const dateOf = s => s.slice(0,10);
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const fmtD = dt => `${dt.getUTCFullYear()}-${d2(dt.getUTCMonth()+1)}-${d2(dt.getUTCDate())}`;
const addDays = (s,n) => { const dt=parseD(s); dt.setUTCDate(dt.getUTCDate()+n); return fmtD(dt); };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
const wd = s => parseD(s).getUTCDay();
const monday = s => addDays(s, -((wd(s)+6)%7));
const nice = s => `${WD[wd(s)]}, ${parseD(s).getUTCDate()}. ${MON[parseD(s).getUTCMonth()]}`;
const mins = sec => Math.round(sec/60);
const paceStr = ms => { if(!ms) return '–'; const s=Math.round(1000/ms); return `${Math.floor(s/60)}:${d2(s%60)}`; };
const pctToPace = p => paceStr(THR*p/100);
const cleanName = n => (n||'').replace(/^IntervalCoach\s*-\s*/,'');
const isRun = t => /Run/.test(t||'');
const isStrength = t => /Weight|Strength/.test(t||'');

/* Zonen über % der Schwellenpace */
const ZONES = [
  { max:80,  name:'Erholung', col:'var(--z1)', hex:'#C9B6FF' },
  { max:90,  name:'Locker',   col:'var(--z2)', hex:'#FFD84D' },
  { max:96,  name:'Tempo',    col:'var(--z3)', hex:'#FF8A1F' },
  { max:102, name:'Schwelle', col:'var(--z4)', hex:'#FF3B3B' },
  { max:999, name:'VO2max',   col:'var(--z5)', hex:'#E838A8' },
];
const zoneOf = p => ZONES.find(z => p < z.max) || ZONES[4];

/* ---------- Workout-Schritte ---------- */
// Intervals kennt Pace als Bereich (%), Einzelwert (%) oder Zone. Alles auf einen Bereich in % umrechnen.
function normStep(s){
  const t = Object.assign({}, s);
  const p = s.pace;
  if (p){
    if (p.units === 'pace_zone' && p.value != null){
      const z = SNAP.settings.pace_zones || [80,90,96,102,999];
      const v = Math.max(1, Math.min(z.length, Math.round(p.value)));
      const lo = v === 1 ? 70 : z[v-2], hi = z[v-1] >= 200 ? lo + 8 : z[v-1];
      t.pace = { start: lo, end: hi, units:'%pace' };
    } else if (p.start == null && p.value != null){
      t.pace = { start: p.value - 2, end: p.value + 2, units:'%pace' };
    } else if (p.start == null) delete t.pace;
  }
  return t;
}
function flatten(steps, out=[]) {
  for (const s of steps||[]) {
    if (s.steps && s.reps) { for (let i=0;i<s.reps;i++) flatten(s.steps,out); }
    else if (s.steps) flatten(s.steps,out);
    else out.push(normStep(s));
  }
  return out;
}
const stepPct = s => s.pace ? (s.pace.start + s.pace.end)/2 : 70;
const estLoad = steps => steps.reduce((a,s)=>a + (s.duration||0)/3600 * Math.pow(stepPct(s)/100,2)*100, 0);

function stepLabel(s){
  if (s.warmup) return 'Einlaufen';
  if (s.cooldown) return 'Auslaufen';
  return s.text || zoneOf(stepPct(s)).name;
}

/* Variante anwenden: leichter / schwerer / kürzer / länger */
const VARIANTS = { leichter:'Leichter', schwerer:'Schwerer', kuerzer:'Kürzer', laenger:'Länger' };
function applyVariant(steps, v){
  const r30 = x => Math.max(60, Math.round(x/30)*30);
  return steps.map(s => {
    const t = Object.assign({}, s, s.pace ? { pace:Object.assign({},s.pace) } : {});
    const p = stepPct(s), hard = p >= 90;
    if (v==='kuerzer') t.duration = r30(s.duration * (hard ? 0.8 : 0.75));
    if (v==='laenger') t.duration = hard ? s.duration : r30(s.duration * 1.25);
    if (v==='leichter' && hard && t.pace){ t.pace.start-=4; t.pace.end-=4; }
    if (v==='schwerer' && hard && t.pace){ t.pace.start+=2; t.pace.end+=2; }
    return t;
  });
}

/* ---------- Plan zusammensetzen ---------- */
function eventDate(e){ return ST.moves[e.id] || dateOf(e.start_date_local); }
function category(e, steps){
  if (isStrength(e.type)) return { name:'Kraft', col:'var(--str)', hard:false, key:false };
  // Hart ist eine Einheit erst ab 8 min über 90 % der Schwellenpace; kurze Steigerungen zählen nicht
  const hardSteps = steps.filter(s => stepPct(s) >= 90);
  const hardSec = hardSteps.reduce((a,s)=>a+(s.duration||0),0);
  let z;
  if (hardSec >= 480){
    const w = hardSteps.reduce((a,s)=>a+stepPct(s)*s.duration,0)/hardSec;
    z = zoneOf(w);
  } else z = /Erholung|Shakeout/i.test(e.name) ? ZONES[0] : ZONES[1];
  return { name:z.name, col:z.col, hard: hardSec >= 480, key: hardSec >= 480 || (e.moving_time||0) >= 4800 };
}
function buildEvent(e0){
  // Hat On. Track das Workout schon in Intervals geändert, rechnen wir vom Original aus
  const o = ST.orig && ST.orig[e0.id];
  const e = o ? Object.assign({}, e0, { workout_doc:o.workout_doc, icu_training_load:o.load, name:o.name }) : e0;
  const base = flatten(e.workout_doc && e.workout_doc.steps);
  let steps = base;
  const v = ST.variants[e.id];
  if (v) steps = applyVariant(base, v);
  const extra = ST.comp[e.id] || 0; // Ausgleich in Sekunden, wird auf den längsten lockeren Abschnitt gelegt
  if (extra && steps.length){
    steps = steps.map(s=>Object.assign({},s));
    let idx = -1, best = 0;
    steps.forEach((s,i)=>{ if (stepPct(s) < 90 && s.duration > best){ best=s.duration; idx=i; } });
    if (idx>=0) steps[idx].duration += extra;
  }
  const baseDur = base.reduce((a,s)=>a+(s.duration||0),0) || e.moving_time || 0;
  const dur = steps.length ? steps.reduce((a,s)=>a+(s.duration||0),0) : (e.moving_time||0);
  const ratio = base.length ? estLoad(steps)/Math.max(estLoad(base),0.1) : 1;
  const load = Math.round((e.icu_training_load||0) * ratio);
  const cat = category(e, base);
  return { raw:e0, id:e.id, date:eventDate(e), name:cleanName(e.name), type:e.type, steps, base, dur, baseDur, load, baseLoad:e.icu_training_load||0, cat, variant:v, extra };
}
function plan(){
  return SNAP.events.filter(e => e.category==='WORKOUT' && !ST.removed[e.id]).map(buildEvent).sort((a,b)=>a.date.localeCompare(b.date));
}
function activitiesOn(day){ return SNAP.activities.filter(a => dateOf(a.start_date_local)===day); }
function matchAct(ev){
  const paired = ev.raw.paired_activity_id && SNAP.activities.find(a=>a.id===ev.raw.paired_activity_id);
  if (paired) return paired;
  const same = a => isRun(ev.type) ? isRun(a.type) : isStrength(ev.type) ? isStrength(a.type) : !isRun(a.type);
  const taken = new Set(SNAP.events.map(x=>x.paired_activity_id).filter(Boolean));
  const free = a => same(a) && !taken.has(a.id);
  const sameDay = activitiesOn(ev.date).find(free);
  if (sameDay) return sameDay;
  if (isStrength(ev.type)) { // Kraft ist flexibel: einen Tag davor oder danach zählt auch
    for (const d of [addDays(ev.date,-1), addDays(ev.date,1)]) { const a = activitiesOn(d).find(free); if (a && d<=TODAY) return a; }
  }
  return null;
}
function statusOf(ev){
  const act = matchAct(ev);
  if (act) return { s:'done', act };
  if (ev.date < TODAY) return { s:'missed' };
  if (ev.date === TODAY) return { s:'today' };
  return { s:'planned' };
}
/* Wochenbilanz und Status "Läuft." */
function weekInfo(mon){
  const days = [...Array(7)].map((_,i)=>addDays(mon,i));
  const evs = plan().filter(e => e.date>=mon && e.date<=days[6]);
  const planned = evs.reduce((a,e)=>a+e.load,0);
  const done = SNAP.activities.filter(a=>{const d=dateOf(a.start_date_local);return d>=mon&&d<=days[6];}).reduce((a,x)=>a+(x.icu_training_load||0),0);
  const dueEvs = evs.filter(e=>e.date<TODAY);
  const missedKey = dueEvs.filter(e=>statusOf(e).s==='missed' && e.cat.key);
  const dueLoad = dueEvs.reduce((a,e)=>a+e.load,0);
  const doneDue = SNAP.activities.filter(a=>{const d=dateOf(a.start_date_local);return d>=mon&&d<TODAY;}).reduce((a,x)=>a+(x.icu_training_load||0),0);
  const onTrack = missedKey.length===0 && (dueLoad===0 || doneDue >= dueLoad*0.8);
  return { days, evs, planned, done, onTrack, missedKey };
}

/* ---------- Grafiken ---------- */
function profileSVG(steps, h, opts={}){
  const total = steps.reduce((a,s)=>a+(s.duration||0),0);
  if (!total) return '';
  const W = 350, H = 140, gap = 2;
  let x = 0, rects = '';
  const hOf = p => Math.max(18, Math.min(1, (p-55)/(110-55)) * H);
  for (const s of steps){
    const w = (s.duration/total)*W, p = stepPct(s), hh = hOf(p), z = zoneOf(p);
    const hollow = z === ZONES[0];
    const ww = Math.max(1,w-gap);
    rects += hollow
      ? `<rect x="${(x+1).toFixed(1)}" y="${(H-hh+1).toFixed(1)}" width="${Math.max(1,ww-2).toFixed(1)}" height="${(hh-2).toFixed(1)}" rx="4" fill="${z.hex}" fill-opacity="${opts.faded?0.1:0.2}" stroke="${z.hex}" stroke-width="2" vector-effect="non-scaling-stroke"${opts.faded?' stroke-opacity="0.5"':''}></rect>`
      : `<rect x="${x.toFixed(1)}" y="${(H-hh).toFixed(1)}" width="${ww.toFixed(1)}" height="${hh.toFixed(1)}" rx="4" fill="${z.hex}"${opts.faded?' fill-opacity="0.8"':''}></rect>`;
    x += w;
  }
  let line = '';
  if (opts.stream){

function coachLine(ev){
  const n = ev.cat.name;
  if (n==='Kraft') return 'Kraft ist dein Verletzungsschutz. Sauber vor schwer.';
  if (n==='Erholung') return 'Heute zählt nur eins: wirklich locker bleiben. Wenn du dich zurückhalten musst, machst du es richtig.';
  if (n==='Locker') return 'Grundlage sammeln. Du solltest dich dabei problemlos unterhalten können.';
  if (n==='Tempo') return 'Zügig, aber kontrolliert. Am Ende sollte noch Luft für einen Abschnitt mehr sein.';
  if (n==='Schwelle') return 'Tempo halten, nicht steigern. Wenn sich der letzte Block wie der erste anfühlt, hast du alles richtig gemacht.';
  return 'Kurz und hart. Volle Konzentration auf saubere Wiederholungen, nicht auf Heldentaten.';

function debrief(ev, act, stream){
  const pts = (stream||[]).filter(r=>r[1]>0.5);
  const avgPct = pts.length ? pts.reduce((a,r)=>a+r[1],0)/pts.length/THR*100 : null;
  const hrPct = act.average_heartrate ? act.average_heartrate / SNAP.settings.lthr * 100 : null;
  let t = `${(act.distance/1000).toFixed(1)} km in ${mins(act.moving_time)} min, Schnitt ${paceStr(act.average_speed)} /km`;
  if (act.average_heartrate) t += ` bei ${Math.round(act.average_heartrate)} bpm`;
  t += '. ';
  if (/Time Trial/i.test(ev.raw.name)) t += 'Ein Testlauf ist dein Messpunkt: Aus ihm leiten sich deine Zonen ab. Gut, dass er im Kasten ist.';
  else if (hrPct && hrPct > 92 && ev.cat.name==='Locker') t += 'Für einen lockeren Lauf war der Puls recht hoch. Beim nächsten Mal bewusst langsamer starten.';
  else t += 'Sauber umgesetzt. Weiter so.';
  return t;
}

/* ---------- Ausgleich ---------- */
function compensate(ev){
  // Wenn eine Einheit reduziert wurde: Defizit auf den nächsten lockeren Lauf dieser Woche legen, gedeckelt auf +15 %
  const deficit = ev.baseLoad - ev.load;
  const wk = monday(ev.date), end = addDays(wk,6);
  const cand = plan().filter(e => e.id!==ev.id && e.date>ev.date && e.date<=end && e.date>=TODAY && isRun(e.type) && !e.cat.hard && !ST.variants[e.id]);
  Object.keys(ST.comp).forEach(k=>{ if (ST.comp[k] && ST.comp[k+'_from']===ev.id){ delete ST.comp[k]; delete ST.comp[k+'_from']; } });
  if (deficit <= 2 || !cand.length) return null;
  const tgt = cand[0];
  const cap = tgt.baseLoad * 0.15;
  const add = Math.min(deficit, cap);
  const secPerLoad = 3600 / (100*Math.pow(0.82,2)); // lockere Minuten pro Belastungspunkt
  const extra = Math.round(add*secPerLoad/60)*60;
  if (extra < 120) return null;
  ST.comp[tgt.id] = extra; ST.comp[tgt.id+'_from'] = ev.id;
  return { tgt, extra, rest: Math.round(deficit-add) };
}

function fmtDur(sec){ return sec>=60 ? `${Math.round(sec/60*2)/2} min`.replace('.',',') : `${sec} s`; }
function stepRow(s){
  const z = zoneOf(stepPct(s));
  const sw = zz => zz===ZONES[0] ? `border:2px solid ${zz.hex}` : `background:${zz.hex}`;
  const pace = x => x.pace ? `${pctToPace(x.pace.end)}–${pctToPace(x.pace.start)} /km` : '';
  if (s.pair){
    const z2 = zoneOf(stepPct(s.pair));
    return `<div class="s"><span class="c" style="${sw(z)}"></span><span class="x"><b>${s.n} × ${esc(stepLabel(s))} ${fmtDur(s.duration)}</b><span>${z.name} · ${pace(s)}</span><span style="display:block">+ ${esc(stepLabel(s.pair))} ${fmtDur(s.pair.duration)} · ${pace(s.pair)}</span></span><span class="dur">${fmtDur(s.n*(s.duration+s.pair.duration))}</span></div>`;
  }
  return `<div class="s"><span class="c" style="${sw(z)}"></span><span class="x"><b>${s.n>1?`${s.n} × `:''}${esc(stepLabel(s))}</b><span>${z.name}${s.pace?` · ${pace(s)}`:''}</span></span><span class="dur">${fmtDur(s.n>1?s.duration*s.n:s.duration)}</span></div>`;
}
function compress(steps){
  // Wiederholungen zusammenfassen: gleiche Schritte und gleiche Paare (Block + Pause)
  const same = (a,b) => a && b && a.duration===b.duration && stepPct(a)===stepPct(b) && stepLabel(a)===stepLabel(b);
  const out = []; let i = 0;
  while (i < steps.length){
    const a = steps[i], b = steps[i+1];
    let k = 1;
    if (b && !same(a,b)){
      while (same(steps[i+2*k], a) && same(steps[i+2*k+1], b)) k++;
      if (k >= 2){ out.push(Object.assign({n:k, pair:b}, a)); i += 2*k; continue; }
    }
    k = 1; while (same(steps[i+k], a)) k++;
    out.push(Object.assign({n:k}, a)); i += k;
  }
  return out;
}

function formInfo(day = TODAY){
  const w = SNAP.wellness.filter(x => x.ctl != null);
  const i = Math.max(0, w.findIndex(x => x.id === day));
  const t = w[i] || w[w.length-1];
  const ctl = t.ctl || 0, atl = t.atl || 0, tsb = ctl - atl;
  const pct = tsb; // absolut, wie in Intervals.icu
  const zone = FORMZ.find(z => tsb >= z.min);
  const before = w.filter(x => x.id < day).slice(-7);
  const avg = k => { const v = before.map(x => x[k]).filter(Boolean); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const last = k => { const x = [...w].filter(x=>x.id<=day).reverse().find(x => x[k]); return x ? { v:x[k], day:x.id } : null; };
  return {
    ctl:Math.round(ctl), atl:Math.round(atl), tsb:Math.round(tsb), pct:Math.round(pct), zone,

  };
}

// Antippen oder Ziehen im Diagramm: Linie und kleines Fenster mit Datum und Werten
function scrubAt(el, clientX){
  const w = rangeData(); if (!w.length) return;
  const r = el.getBoundingClientRect();
  const t = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  const i = Math.round(t * (w.length-1)), x = w[i];
  const px = i / Math.max(1, w.length-1);
  document.querySelectorAll('.scrub').forEach(s => { const l = s.querySelector('.scrubline'); l.style.display='block'; l.style.left = `calc(${(px*100).toFixed(2)}% - 1px)`; });
  const tsb = Math.round(x.ctl - x.atl), z = FORMZ.find(q => tsb >= q.min);
  const tip = document.getElementById('scrubtip');
  tip.style.display = 'flex';
  tip.innerHTML = `<b>${x.id===TODAY?'Heute':`${WD[wd(x.id)]}, ${shortD(x.id)}`}</b><span>Fitness <b>${Math.round(x.ctl)}</b></span><span>Ermüdung <b>${Math.round(x.atl)}</b></span><span>Form <b style="color:${z.col}">${tsb>0?'+':''}${tsb}</b></span>`;
}
function scrubEnd(){
  document.querySelectorAll('.scrubline').forEach(l => l.style.display = 'none');
  const tip = document.getElementById('scrubtip'); if (tip) tip.style.display = 'none';
}
let scrubbing = null;
document.addEventListener('pointerdown', e => { const s = e.target.closest('.scrub'); if (!s) return; scrubbing = s; scrubAt(s, e.clientX); });
document.addEventListener('pointermove', e => { if (scrubbing) scrubAt(scrubbing, e.clientX); });
document.addEventListener('pointerup', () => { if (scrubbing){ scrubbing = null; setTimeout(scrubEnd, 1500); } });
document.addEventListener('pointercancel', () => { scrubbing = null; scrubEnd(); });
document.addEventListener('click', e => { const b = e.target.closest('[data-act="frange"]'); if (b){ FR.key = b.dataset.v; render(); } });

function flatSteps(steps){ return flatten(steps); }
function libWorkout(t, l = 1, scaleWu = 1){
  const main = t.main(l);
  const steps = [];
  if (t.wu) steps.push(WU(t.wu * scaleWu));
  steps.push(...main);
  if (t.cd) steps.push(CD(t.cd * scaleWu));
  return steps;
}
const durOf = steps => flatSteps(steps).reduce((a,s)=>a+(s.duration||0),0);
const loadOf = steps => Math.round(estLoad(flatSteps(steps)));
// Workout auf eine Wunschdauer bringen: Stufe wählen, dann Ein-/Auslaufen bzw. Grundlage anpassen
function fitWorkout(t, minutes){
  const target = minutes * 60;
  let best = null;
  for (const l of [2,1,0]){
    const core = durOf(t.main(l));
    const minWrap = ((t.wu ? 10 : 0) + (t.cd ? 5 : 0)) * 60;
    if (core + minWrap <= target + 60 || l === 0){ best = l; break; }
  }
  const main = t.main(best);
  const core = durOf(main);
  let left = Math.max(0, target - core);
  const steps = [];
  if (!t.wu && !t.cd){
    // reine Dauerläufe: Hauptteil auf die Dauer strecken
    const f = flatSteps(main);
    if (f.length === 1) return { steps:[Object.assign({}, f[0], { duration: Math.max(600, target) })], level:best };
  }
  let wu = t.wu ? Math.min(Math.max(600, left * 0.6), 20*60) : 0;
  let cd = t.cd ? Math.min(Math.max(300, left - wu), 15*60) : 0;
  const extra = Math.max(0, left - wu - cd);
  if (t.wu) steps.push(Object.assign(WU(0), { duration: Math.round(wu/30)*30 }));
  steps.push(...main);
  if (extra >= 300) steps.push(EASY(Math.round(extra/60), 'Locker'));
  if (t.cd) steps.push(Object.assign(CD(0), { duration: Math.round(cd/30)*30 }));
  return { steps, level:best };
}
// Für später: Schritte als Intervals-Text (so landen sie auf der Uhr)
function toIntervalsText(steps){
  const one = s => `- ${s.duration%60 ? s.duration+'s' : (s.duration/60)+'m'} ${Math.round(s.pace.start)}-${Math.round(s.pace.end)}% Pace${s.text?` ${s.text}`:''}`;
  return steps.map(s => s.reps ? `\n${s.reps}x\n${s.steps.map(x=>x.reps?toIntervalsText([x]):one(x)).join('\n')}\n` : one(s)).join('\n');
}

  return { cat:'vo2', why:'Du bist frisch. Ein guter Tag für harte Intervalle.' };
}

/* ---------- Planerstellung ---------- */
const GOAL = { dist:'hm', date:'', time:'', days:4, long:'So' };
const DISTS = {
  '5k':  { name:'5 km', km:5,      minW:6,  taper:1, ctl:35, speed:1.06, keyB:'vo2',      keyA:'schwelle' },
  '10k': { name:'10 km', km:10,    minW:8,  taper:1, ctl:40, speed:1.02, keyB:'schwelle', keyA:'vo2' },
  'hm':  { name:'Halbmarathon', km:21.0975, minW:10, taper:2, ctl:45, speed:0.97, keyB:'schwelle', keyA:'tempo' },
  'm':   { name:'Marathon', km:42.195, minW:14, taper:2, ctl:55, speed:0.91, keyB:'tempo',    keyA:'schwelle' },
};
const fmtTime = sec => { sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}:${d2(m)}:${d2(s)}` : `${m}:${d2(s)}`; };
const parseTime = t => { const p = (t||'').trim().split(':').map(Number); if (!p.length || p.some(isNaN)) return null; return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p.length===2 ? p[0]*60+p[1] : null; };
function predictTime(dk){ const d = DISTS[dk]; return d.km*1000 / (THR * d.speed); }
function otherLoadPerWeek(){
  const from = addDays(TODAY, -28);
  const tot = SNAP.activities.filter(a => !isRun(a.type) && dateOf(a.start_date_local) >= from).reduce((a,x)=>a+(x.icu_training_load||0),0);
  return Math.round(tot / 4);
}
function runMinutesPerWeek(){
  const from = addDays(TODAY, -28);
  const tot = SNAP.activities.filter(a => isRun(a.type) && dateOf(a.start_date_local) >= from).reduce((a,x)=>a+(x.moving_time||0),0);
  return Math.round(tot / 60 / 4);
}
const PEAK_MIN = { '5k':210, '10k':240, 'hm':300, 'm':390 };
const DAYF = { 3:0.8, 4:0.9, 5:1, 6:1.1 };
const LONG = { '5k':[50,80], '10k':[60,95], 'hm':[70,120], 'm':[90,180] };
function buildPlan(g){
  const d = DISTS[g.dist];
  const start = addDays(monday(TODAY), 7); // Start: nächster Montag
  const race = g.date;
  const weeks = Math.floor((parseD(race) - parseD(start)) / 864e5 / 7) + 1;
  if (weeks < 2) return { error:'Das Renndatum liegt zu nah für einen eigenen Plan.' };
  const f = formInfo(), ctl0 = f.ctl;
  const warn = [];
  const taper = Math.min(d.taper, weeks-1);
  const build = weeks - taper;
  const startMin = Math.max(90, runMinutesPerWeek());
  const peak = Math.round(PEAK_MIN[g.dist] * DAYF[g.days]);
  // Umfang steigt höchstens 10 % pro Woche (ohne Erholungswochen)
  const steps = Math.max(1, build - Math.floor(build/4) - 1);
  let growth = Math.pow(peak / startMin, 1/steps) - 1;
  if (weeks < d.minW) warn.push({ lvl:'r', t:`Sehr knapp: Für ${d.name} sind mindestens ${d.minW} Wochen Vorbereitung sinnvoll, du hast ${weeks}.` });
  if (growth > 0.12) warn.push({ lvl:'r', t:`Zu steil: Dein Laufumfang müsste um ${Math.round(growth*100)} % pro Woche steigen, von ${fmtH(startMin)} auf ${fmtH(peak)}. Sicher sind etwa 10 %. Ich deckele das, du startest dann mit weniger Umfang ins Rennen als ideal.` });
  else if (growth > 0.10) warn.push({ lvl:'y', t:`Ambitioniert: ${Math.round(growth*100)} % mehr Laufumfang pro Woche liegen knapp über den empfohlenen 10 %. Achte besonders auf Erholung.` });
  growth = Math.min(growth, 0.10);
  if (g.dist === 'm' && g.days < 4) warn.push({ lvl:'y', t:'Für einen Marathon sind vier oder mehr Lauftage pro Woche deutlich besser. Mit drei Tagen wird der lange Lauf sehr lang.' });
  const pred = predictTime(g.dist), goal = parseTime(g.time);
  if (goal){
    const gap = (pred - goal) / pred * 100;
    if (gap > 8) warn.push({ lvl:'r', t:`Zielzeit ${fmtTime(goal)} liegt ${Math.round(gap)} % unter deiner aktuellen Prognose von ${fmtTime(pred)}. Das ist in ${weeks} Wochen kaum realistisch.` });
    else if (gap > 4) warn.push({ lvl:'y', t:`Zielzeit ${fmtTime(goal)} ist ambitioniert: Deine aktuelle Prognose liegt bei ${fmtTime(pred)}. Machbar, wenn das Training gut läuft.` });
  }
  const other = otherLoadPerWeek();
  const perMinEasy = 100*Math.pow(0.84,2)/60;
  const out = [];
  let ctl = ctl0, vol = startMin, maxRamp = 0;
  for (let i = 0; i < weeks; i++){
    const wStart = addDays(start, i*7);
    const isRace = i === weeks-1;
    let phase;
    if (i >= build) phase = 'Tapering';
    else if (i < Math.round(build*0.4)) phase = 'Grundlage';
    else if (i < Math.round(build*0.8)) phase = 'Aufbau';
    else phase = 'Spitze';
    const recovery = phase !== 'Tapering' && (i+1) % 4 === 0;
    if (!recovery && phase !== 'Tapering' && i > 0) vol = Math.min(peak, vol * (1 + growth));
    let wMin = recovery ? vol * 0.75 : vol;
    if (phase === 'Tapering') wMin = vol * (isRace ? 0.5 : 0.7);
    wMin = Math.round(wMin / 5) * 5;
    // Qualitätseinheiten
    const q = [];
    if (phase === 'Grundlage') q.push('GRU-4');
    if (phase === 'Aufbau') q.push(pickId(d.keyB, i), pickId(d.keyA, i));
    if (phase === 'Spitze') q.push(pickId(d.keyB, i), g.dist==='m'||g.dist==='hm' ? 'WET-3' : 'WET-2');
    if (phase === 'Tapering') q.push(isRace ? 'WET-1' : pickId(d.keyB, i));
    const nQ = Math.min(q.length, g.days - 2 + (isRace ? 1 : 0));
    const qSessions = q.slice(0, nQ).map(id => { const t = LIB.find(x=>x.id===id); const st_ = libWorkout(t, recovery || phase==='Tapering' ? 0 : 1); return { name:t.name, min:mins(durOf(st_)), load:loadOf(st_), col:CATS.find(c=>c.key===t.cat).col }; });
    const sessions = [...qSessions];
    let rest = wMin - qSessions.reduce((a,s)=>a+s.min,0);
    if (!isRace){
      const [lo, hi] = LONG[g.dist];
      const prog = Math.min(1, i / Math.max(1, build-1));
      let longMin = lo + (hi-lo) * prog;
      if (recovery) longMin *= 0.8;
      if (phase==='Tapering') longMin = lo * 0.8;
      longMin = Math.round(Math.min(longMin, wMin * 0.42) / 5) * 5;
      sessions.push({ name:'Langer Lauf', min:longMin, load:Math.round(longMin*perMinEasy), col:'#FFD84D', day:g.long });
      rest -= longMin;
    }
    const nEasy = g.days - sessions.length - (isRace ? 1 : 0);
    for (let k = 0; k < nEasy; k++){
      const m = Math.max(30, Math.round(rest / nEasy / 5) * 5);
      sessions.push({ name:'Lockerer Lauf', min:m, load:Math.round(m*perMinEasy), col:'#FFD84D' });
    }
    if (isRace) sessions.push({ name:`Rennen: ${d.name}`, min:Math.round(pred/60), load:Math.round(pred/60*1.5), col:'#D7FF3D' });
    const totMin = sessions.reduce((a,s)=>a+s.min,0);
    const load = sessions.reduce((a,s)=>a+s.load,0) + other;
    const prev = ctl;
    ctl = ctl + (load/7 - ctl) * (1 - Math.exp(-7/42));
    maxRamp = Math.max(maxRamp, ctl - prev);
    const long = sessions.find(s=>s.name==='Langer Lauf');
    if (long && long.min > totMin*0.4 && !warn.some(w=>w.k==='long')) warn.push({ k:'long', lvl:'y', t:'In manchen Wochen macht der lange Lauf mehr als 40 % deiner Laufzeit aus. Ein Lauftag mehr würde das entzerren.' });
    out.push({ i, wStart, phase, recovery, load: Math.round(load), ctl:Math.round(ctl), sessions, totMin });
  }
  if (maxRamp > 6) warn.push({ lvl:'r', t:`In einzelnen Wochen steigt deine Fitness um bis zu ${maxRamp.toFixed(1)} Punkte. Mehr als etwa 5 pro Woche erhöht das Verletzungsrisiko deutlich.` });
  const target = Math.round(d.ctl * (0.75 + g.days * 0.0625));
  const ctlEnd = Math.round(out[out.length-1].ctl);
  if (ctlEnd < target - 8) warn.push({ lvl:'y', t:`Am Renntag liegt deine Fitness voraussichtlich bei ${ctlEnd}, für ${d.name} wären etwa ${target} ideal. Das Ziel ist trotzdem schaffbar, aber eher zum Ankommen als für eine Bestzeit.` });
  return { weeks: out, warn, target, ctlEnd, ctl0, pred, goal, other, d, race, startMin, peak };
}
function fmtH(m){ return `${Math.floor(m/60)}:${d2(Math.round(m%60))} h`; }

    f.querySelectorAll(`input[name="${e.target.name}"]`).forEach(i => i.parentElement.classList.toggle('sel', i.checked));

document.addEventListener('submit', e => {
  if (e.target.id !== 'goalform') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const date = fd.get('date'), time = String(fd.get('time')||'').trim();

});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;

  if (act === 'tnlater'){

/* ---------- Tagesschalter "Läuft." ---------- */
// An, sobald das heutige Training erledigt ist. Ruhetage sind automatisch an.
function dayDone(day){
  const evs = plan().filter(e => e.date === day);
  if (!evs.length) return { rest:true, done:true };
  return { rest:false, done: evs.every(e => statusOf(e).s === 'done'), evs };
}
function dayStatus(){
  const d = dayDone(TODAY);
  if (d.rest) return { on:true, label:'Läuft.', sub:'Ruhetag. Erholung gehört zum Plan.' };
  if (d.done) return { on:true, label:'Läuft.', sub:'Heute erledigt. Stark.' };
  const ev = d.evs.find(e => statusOf(e).s !== 'done');
  return { on:false, label:`Heute: ${ev.cat.name} · ${mins(ev.dur)} min`, sub:'Sobald dein Lauf von der Uhr reinkommt, legt sich der Schalter um.' };
}
function streakDays(){
  let n = dayDone(TODAY).done ? 1 : 0;
  for (let i = 1; i < 60; i++){
    const day = addDays(TODAY, -i);
    const first = SNAP.events.map(e=>dateOf(e.start_date_local)).sort()[0];
    if (!first || day < first) break; // nur Tage, für die ein Plan vorliegt
    if (!dayDone(day).done) break;
    n++;
  }
  return n;
}

/* ---------- Automatisch umplanen ---------- */
// Verpasste Schlüsseleinheit dieser Woche auf einen späteren lockeren Tag legen, wenn das sicher geht.
function autoReplan(){
  const mon = monday(TODAY), sun = addDays(mon, 6);
  const f = formInfo();
  const all = plan();
  for (const ev of all){
    if (ev.date < mon || ev.date >= TODAY || !ev.cat.key || !ev.cat.hard) continue;
    if (statusOf(ev).s !== 'missed') continue;
    if (ST.auto[ev.id] !== undefined) continue;
    if (ST.unfit[ev.date]) { ST.auto[ev.id] = { none:true, reason:'unfit' }; continue; }
    const hardOn = day => plan().some(e => e.id !== ev.id && e.date === day && e.cat.hard && statusOf(e).s !== 'missed');
    const doneHard = day => activitiesOn(day).some(a => isRun(a.type) && (a.icu_training_load||0) >= 55);
    const cands = plan().filter(e => e.date >= TODAY && e.date <= sun && isRun(e.type) && !e.cat.hard && statusOf(e).s !== 'done' && !ST.variants[e.id]);
    let pick = null;
    for (const c of cands){
      const prev = addDays(c.date, -1), next = addDays(c.date, 1);
      if (hardOn(prev) || hardOn(next) || doneHard(prev)) continue;
      if (f.zone.key === 'high' && c.date <= addDays(TODAY, 1)) continue; // müde: nicht sofort hart
      pick = c; break;
    }
    if (pick){
      ST.moves[ev.id] = pick.date;
      ST.removed[pick.id] = 'auto';
      ST.auto[ev.id] = { to: pick.id, from: ev.date, day: pick.date, name: ev.name, easy: pick.name };
    } else {
      ST.auto[ev.id] = { none:true, from: ev.date, name: ev.name };
    }
    save();
  }
}
function autoNote(){
  const items = Object.entries(ST.auto).filter(([id,a]) => !a.seen && a.from && a.from >= monday(TODAY));
  if (!items.length) return '';
  return items.map(([id,a]) => a.none
    ? `<p class="note"><b>Plan angepasst:</b> ${esc(a.name)} von ${WDL[wd(a.from)]} passt diese Woche nicht mehr sicher rein und fällt weg. Fehlender Umfang wird locker ausgeglichen. <button class="chip" data-act="autook" data-id="${id}" style="margin-top:8px">Okay</button></p>`
    : `<p class="note"><b>Plan angepasst:</b> ${WDL[wd(a.from)]} ist ausgefallen, deshalb ist ${WDL[wd(a.day)]} jetzt <b>${esc(a.name)}</b> statt ${esc(a.easy)}.<span style="display:flex;gap:8px;margin-top:10px"><button class="chip" data-act="autook" data-id="${id}">Passt</button><button class="chip" data-act="autoundo" data-id="${id}" style="color:var(--lilac)">Rückgängig</button></span></p>`).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, id } = b.dataset;
  const a = ST.auto[id];
  if (act === 'autook' && a){ a.seen = true; save(); render(); if (!a.none){ pushMove(id, a.day); pushDelete(String(a.to)); } }
  if (act === 'autoundo' && a){
    delete ST.moves[id]; if (a.to) delete ST.removed[a.to];
    ST.auto[id] = { none:true, undone:true, seen:true, from:a.from, name:a.name };
    save(); render(); toast('Rückgängig gemacht. Die Woche ist wie vorher.');
  }
});


/* ---------- Training tauschen ---------- */
function swapCandidate(t){
  if (GEN.mode === 'tn'){ const fw = fitWorkout(t, GEN.minutes || TN.minutes); return { steps: fw.steps, level: fw.level }; }
  return { steps: libWorkout(t, GEN.level), level: GEN.level };
}
function swapSheet(cat){
  if (!GEN) return;
  cat = cat || GEN.t.cat;
  let h = `<h2>Training tauschen</h2><p class="small muted">${GEN.mode==='tn' ? `Alle auf ${GEN.minutes || TN.minutes} min angepasst.` : 'In derselben Stufe.'}</p>`;
  h += `<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -4px">${CATS.map(c => `<button class="chip" data-act="swapcat" data-v="${c.key}" style="flex:none;${c.key===cat?`background:${c.col};color:var(--bg)`:'color:var(--lilac)'}">${c.name}</button>`).join('')}</div>`;
  h += `<div class="list">`;
  for (const t of LIB.filter(x => x.cat === cat)){
    const c = swapCandidate(t), fl = flatSteps(c.steps), cur = t.id === GEN.t.id;
    h += `<button class="ev" data-act="swappick" data-v="${t.id}" style="flex-direction:column;align-items:stretch;gap:8px;${cur?'outline:2px solid var(--lime)':''}">
      <span class="row"><span class="n" style="font-weight:700">${esc(t.name)}</span><span class="small muted">${cur?'aktuell · ':''}${mins(durOf(fl))} min · ${loadOf(fl)}</span></span>
      <span style="display:block;background:var(--bg);border-radius:10px;padding:6px">${profileSVG(fl,40)}</span></button>`;
  }
  openSheet(h + `</div>`);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, v } = b.dataset;
  if (act === 'swap') swapSheet();
  if (act === 'swapcat') swapSheet(v);
  if (act === 'swappick' && GEN){
    const t = LIB.find(x => x.id === v), c = swapCandidate(t);
    Object.assign(GEN, { t, steps: c.steps, level: c.level });
    closeSheet(); render(); window.scrollTo(0,0);
  }
});


/* ---------- Woche: durchgehende Ansicht über mehrere Wochen ---------- */
let showPrevWeek = false;
function lastPlanDate(){ return SNAP.events.map(e=>dateOf(e.start_date_local)).sort().pop() || TODAY; }
function weekBlock(mon){
  const wi = weekInfo(mon);
  const pct = wi.planned ? Math.min(100, Math.round(wi.done/wi.planned*100)) : 0;
  const thisMon = monday(TODAY);
  const title = mon === thisMon ? 'Diese Woche' : mon === addDays(thisMon,7) ? 'Nächste Woche' : mon === addDays(thisMon,-7) ? 'Letzte Woche' : `${shortD(mon)} – ${shortD(addDays(mon,6))}`;
  let h = `<div class="weeksep"><div class="row"><h2>${title}</h2><span class="small muted">${mon<=TODAY?`Belastung ${wi.done} von ${wi.planned}`:`geplant ${wi.planned}`}</span></div>${mon<=TODAY?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</div>`;
  for (const d of wi.days){
    const evs = wi.evs.filter(e=>e.date===d);
    h += `<div class="wday" data-day="${d}"><p class="lbl${d===TODAY?' today':''}">${nice(d)}${d===TODAY?' · heute':''}</p>`;
    if (!evs.length) h += `<p class="empty">Ruhetag</p>`;
    for (const ev of evs){
      const st = statusOf(ev);
      const right = st.s==='done' ? '<span class="st" style="color:var(--lime)">✓ erledigt</span>' : st.s==='missed' ? '<span class="st" style="color:#FF6B6B">verpasst</span>' : `<span class="st muted">${ev.load}</span>`;
      const meta = st.s==='done' && st.act ? (isRun(st.act.type) ? `${(st.act.distance/1000).toFixed(1)} km · ${mins(st.act.moving_time)} min · ${paceStr(st.act.average_speed)} /km` : `${st.act.name} · ${mins(st.act.moving_time)} min`) : `${ev.cat.name}${ev.dur?` · ${mins(ev.dur)} min`:''}${ev.variant?` · ${VARIANTS[ev.variant]}`:''}${ev.extra?` · +${mins(ev.extra)} min Ausgleich`:''}${ST.moves[ev.id]?' · verschoben':''}`;
      const movable = st.s!=='done' && ev.date >= TODAY;
      h += `<button class="ev ${st.s}" data-act="menu" data-id="${ev.id}"${movable?' data-drag="1"':''}><span class="stripe" style="background:${ev.cat.col}"></span><span class="t"><span class="n">${esc(ev.name)}</span><span class="m">${esc(meta)}</span></span>${right}</button>`;
    }
    h += `</div>`;
  }
  const extras = SNAP.activities.filter(a=>{const d=dateOf(a.start_date_local);return d>=mon&&d<=wi.days[6] && !wi.evs.some(e=>statusOf(e).act===a);});
  if (extras.length){
    h += `<div class="wday"><p class="lbl">Zusätzlich trainiert</p>`;
    for (const a of extras) h += `<div class="ev done"><span class="stripe" style="background:var(--line)"></span><span class="t"><span class="n">${esc(a.name)}</span><span class="m">${nice(dateOf(a.start_date_local))} · ${esc(a.type)} · ${mins(a.moving_time)} min</span></span><span class="st muted">${a.icu_training_load??''}</span></div>`;
    h += `</div>`;
  }
  return h;
}
function viewWeek(){
  let h = topBar();
  h += `<a href="#ziel" class="btn ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Neuen Plan erstellen</a>`;
  h += `<p class="small muted" style="text-align:center">Kurz tippen für Details · lange drücken zum Verschieben</p>`;
  const thisMon = monday(TODAY), end = lastPlanDate();
  h += `<section class="list">`;
  h += showPrevWeek ? weekBlock(addDays(thisMon,-7)) : `<button class="chip" data-act="prevweek" style="align-self:center;color:var(--lilac)">Letzte Woche anzeigen</button>`;
  for (let mon = thisMon; mon <= end || mon === thisMon; mon = addDays(mon,7)) h += weekBlock(mon);
  return h + `</section>` + navBar('woche');
}

/* ---------- Verschieben-Menü über mehrere Wochen ---------- */
function moveSheet(id){
  const ev = plan().find(e=>String(e.id)===String(id)); if(!ev) return;
  let h = `<h2>Verschieben</h2><p class="small muted">${esc(ev.name)} · aktuell ${nice(ev.date)}</p>`;
  const end = lastPlanDate();
  for (let mon = monday(TODAY), n = 0; (mon <= end || n === 0) && n < 5; mon = addDays(mon,7), n++){
    h += `<div class="mvweek"><p class="small" style="font-weight:700;color:var(--soft)">${n===0?'Diese Woche':n===1?'Nächste Woche':`${shortD(mon)} – ${shortD(addDays(mon,6))}`}</p><div class="mv">`;
    for (let i=0;i<7;i++){
      const d = addDays(mon,i);
      if (d < TODAY){ h += `<button class="x" disabled aria-label="${WDL[wd(d)]} vorbei"><span>${WD[wd(d)]}</span><span>${parseD(d).getUTCDate()}.</span></button>`; continue; }
      const c = d===ev.date ? {c:'g'} : conflict(ev,d);
      h += `<button class="${c.c}${d===ev.date?' cur':''}" data-act="moveto" data-id="${ev.id}" data-d="${d}"><span>${WD[wd(d)]}</span><span>${parseD(d).getUTCDate()}.</span></button>`;
    }
    h += `</div></div>`;
  }
  h += `<p class="hint" id="mvhint">Grün passt, gelb geht mit Hinweis, rot kollidiert mit einer harten Einheit.</p>`;
  openSheet(h);
}

/* ---------- Drag & Drop: lange drücken, ziehen, loslassen ---------- */
const DRAG = { timer:null, start:null, el:null, ghost:null, ev:null, over:null, active:false, justDragged:false, raf:null, y:0 };
function dragCancelPending(){ clearTimeout(DRAG.timer); DRAG.timer = null; DRAG.start = null; }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.ev[data-drag]'); if (!el) return;
  DRAG.start = { x:e.clientX, y:e.clientY }; DRAG.el = el;
  DRAG.timer = setTimeout(() => startDrag(e.clientX, e.clientY), 420);
});
function startDrag(x, y){
  const el = DRAG.el; if (!el) return;
  const ev = plan().find(v => String(v.id) === el.dataset.id); if (!ev) return;
  DRAG.active = true; DRAG.ev = ev; DRAG.y = y;
  try { navigator.vibrate && navigator.vibrate(25); } catch(_){}
  const r = el.getBoundingClientRect();
  const g = el.cloneNode(true); g.classList.add('drag-ghost'); g.style.width = r.width + 'px';
  g.dataset.dx = x - r.left; g.dataset.dy = y - r.top;
  document.body.appendChild(g); DRAG.ghost = g; el.classList.add('lifted');
  moveGhost(x, y);
  autoScroll();
}
function moveGhost(x, y){
  const g = DRAG.ghost; if (!g) return;
  g.style.transform = `translate(${x - g.dataset.dx}px, ${y - g.dataset.dy}px) scale(1.03)`;
  DRAG.y = y;
  g.style.display = 'none';
  const under = document.elementFromPoint(x, y);
  g.style.display = '';
  const day = under && under.closest('.wday[data-day]');
  if (DRAG.over && DRAG.over !== day) DRAG.over.classList.remove('drop-g','drop-y','drop-r');
  DRAG.over = null;
  if (day && day.dataset.day >= TODAY){
    const d = day.dataset.day;
    const c = d === DRAG.ev.date ? {c:'g'} : conflict(DRAG.ev, d);
    day.classList.remove('drop-g','drop-y','drop-r'); day.classList.add('drop-' + c.c);
    DRAG.over = day;
  }
}
function autoScroll(){
  if (!DRAG.active) return;
  const edge = 90, H = window.innerHeight;
  if (DRAG.y < edge) window.scrollBy(0, -Math.ceil((edge - DRAG.y) / 6));
  else if (DRAG.y > H - edge - 70) window.scrollBy(0, Math.ceil((DRAG.y - (H - edge - 70)) / 6));
  DRAG.raf = requestAnimationFrame(autoScroll);
}
document.addEventListener('pointermove', e => {
  if (DRAG.active){ moveGhost(e.clientX, e.clientY); return; }
  if (DRAG.start && Math.hypot(e.clientX - DRAG.start.x, e.clientY - DRAG.start.y) > 8) dragCancelPending();
});
// Während des Ziehens darf die Seite nicht von selbst scrollen
document.addEventListener('touchmove', e => {
  if (DRAG.active){ e.preventDefault(); const t = e.touches[0]; if (t) moveGhost(t.clientX, t.clientY); }
  else if (DRAG.start && e.touches[0] && Math.hypot(e.touches[0].clientX - DRAG.start.x, e.touches[0].clientY - DRAG.start.y) > 8) dragCancelPending();
}, { passive:false });
document.addEventListener('touchend', () => { if (DRAG.active) endDrag(false); else dragCancelPending(); });
function endDrag(cancel){
  dragCancelPending();
  if (!DRAG.active) return;
  cancelAnimationFrame(DRAG.raf);
  const ev = DRAG.ev, over = DRAG.over;
  if (DRAG.ghost) DRAG.ghost.remove();
  if (DRAG.el) DRAG.el.classList.remove('lifted');
  if (over) over.classList.remove('drop-g','drop-y','drop-r');
  DRAG.active = false; DRAG.ghost = null; DRAG.over = null; DRAG.justDragged = true;
  setTimeout(() => DRAG.justDragged = false, 350);
  if (cancel || !over) return;
  const d = over.dataset.day;
  if (d === ev.date) return;
  const c = conflict(ev, d);
  const apply = () => {
    if (d === dateOf(ev.raw.start_date_local)) delete ST.moves[ev.id]; else ST.moves[ev.id] = d;
    save(); render(); toast(`Verschoben auf ${nice(d)}${c.c!=='g' ? ' · ' + c.why : ''}`);
    pushMove(String(ev.id), d);
  };
  if (c.c === 'r'){
    openSheet(`<h2>Trotzdem verschieben?</h2><p style="line-height:1.5">${esc(c.why)}</p><div class="grid2"><button class="btn ghost" data-act="dragno">Abbrechen</button><button class="btn" data-act="dragyes" data-id="${ev.id}" data-d="${d}" style="background:#FF6B6B;color:var(--bg)">Verschieben</button></div>`);
  } else apply();
}
document.addEventListener('pointerup', () => endDrag(false));
document.addEventListener('pointercancel', () => { if (!DRAG.active) dragCancelPending(); }); // aktives Ziehen endet über touchend
document.addEventListener('contextmenu', e => { if (e.target.closest('.ev[data-drag]')) e.preventDefault(); });
// Klick nach dem Ziehen nicht als Tippen werten
document.addEventListener('click', e => { if (DRAG.justDragged && e.target.closest('.ev')){ e.stopImmediatePropagation(); e.preventDefault(); } }, true);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'prevweek'){ showPrevWeek = true; render(); }
  if (b.dataset.act === 'dragno') closeSheet();
  if (b.dataset.act === 'dragyes'){
    const { id, d } = b.dataset; const ev = plan().find(v => String(v.id) === id);
    if (d === dateOf(ev.raw.start_date_local)) delete ST.moves[id]; else ST.moves[id] = d;
    save(); closeSheet(); render(); toast(`Verschoben auf ${nice(d)}`);
    pushMove(id, d);
  }
});


/* ---------- Zurückschreiben nach Intervals.icu (nur Live-App) ---------- */
function compTargets(){ return Object.keys(ST.comp).filter(k => !k.endsWith('_from') && ST.comp[k]); }
async function api(method, path, body){
  let token = ''; try { token = localStorage.getItem('ontrack.token') || ''; } catch(e){}
  const r = await fetch(`${CONFIG.apiBase}${path}`, { method, headers:{ Authorization:`Bearer ${token}`, 'Content-Type':'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json().catch(() => ({}));
}
let syncQueue = Promise.resolve(), syncPending = 0;
function sync(label, fn){
  if (!LIVE) return;
  syncPending++;
  syncQueue = syncQueue.then(fn).then(() => {
    if (--syncPending === 0){ toast('Gespeichert · geht auf deine Uhr'); refreshLive(); }
  }).catch(err => {
    syncPending = Math.max(0, syncPending-1);
    toast(`${label} konnte nicht an Intervals gesendet werden. Bitte später nochmal versuchen.`);
  });
}
async function refreshLive(){
  let token = ''; try { token = localStorage.getItem('ontrack.token') || ''; } catch(e){}
  try { if (await loadLive(token) === 'ok') render(); } catch(e){}
}
const fmtSec = s => s % 60 ? `${Math.round(s)}s` : `${s/60}m`;
function stepsToText(steps){
  const rng = s => { const a = Math.round(s.pace.start), b = Math.round(s.pace.end); return s.ramp ? `ramp ${a}-${b}%` : `${Math.min(a,b)}-${Math.max(a,b)}%`; };
  const line = s => `- ${(s.text || stepLabel(s)).replace(/[\n-]/g,' ').trim()} ${fmtSec(s.duration)}${s.pace ? ` ${rng(s)} Pace` : ''}`;
  return compress(steps).map(s => s.pair ? `\n${s.n}x\n${line(s)}\n${line(s.pair)}\n` : s.n > 1 ? `\n${s.n}x\n${line(s)}\n` : line(s)).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
function pushMove(id, d){ sync('Das Verschieben', () => api('PUT', `/api/events/${id}`, { start_date_local: `${d}T00:00:00` })); }
function pushDelete(id){ sync('Das Streichen', () => api('DELETE', `/api/events/${id}`)); }
function pushShape(id){
  const raw = SNAP.events.find(e => String(e.id) === String(id)); if (!raw || isStrength(raw.type)) return;
  const changed = ST.variants[id] || ST.comp[id];
  if (!changed){
    const o = ST.orig[id]; if (!o) return;
    sync('Das Zurücksetzen', async () => { await api('PUT', `/api/events/${id}`, { name:o.name, description:o.description || stepsToText(flatten(o.workout_doc && o.workout_doc.steps)) }); delete ST.orig[id]; save(); });
    return;
  }
  if (!ST.orig[id]) { ST.orig[id] = { name:raw.name, description:raw.description || '', workout_doc:raw.workout_doc, load:raw.icu_training_load }; save(); }
  const ev = buildEvent(raw);
  const base = cleanName(ST.orig[id].name).replace(/^On\.Track · /,'');
  const tag = ST.variants[id] ? ` (${VARIANTS[ST.variants[id]]})` : ST.comp[id] ? ' (Ausgleich)' : '';
  sync('Die Anpassung', () => api('PUT', `/api/events/${id}`, { name:`On.Track · ${base}${tag}`, description: stepsToText(ev.steps) }));
}
function syncShapes(ids){ [...new Set(ids.map(String))].forEach(pushShape); }
function pushCreate(gen, day){
  if (!gen) return;
  const steps = flatSteps(gen.steps);
  sync('Das Workout', () => api('POST', '/api/events', { type:'Run', start_date_local:`${day}T00:00:00`, name:`On.Track · ${gen.t.name}`, description: stepsToText(steps) }));
  toast(day === TODAY ? 'Wird an deine Uhr gesendet …' : `Wird für ${nice(day)} eingeplant …`);
}


/* ---------- Laufaufbau: Laufbelastung der letzten 7 Tage mit Soll-Zone ---------- */
// Nur Läufe. Soll-Zone aus deinem Laufniveau der letzten 4 Wochen (0,8- bis 1,3-fach),
// nach vorn aus den geplanten Läufen (±15 %). Gestrichelt rot: Sicherheitsgrenze.
function runLoadOn(day){ return SNAP.activities.filter(a => isRun(a.type) && dateOf(a.start_date_local) === day).reduce((x,a)=>x+(a.icu_training_load||0),0); }
function plannedRunOn(day){ return plan().filter(e => e.date === day && isRun(e.type) && statusOf(e).s !== 'done').reduce((x,e)=>x+e.load,0); }
function runSeries(){
  const days = RANGES.find(r => r[0] === FR.key)[2];
  const ahead = 14;
  const from = addDays(TODAY, -days + 1), to = addDays(TODAY, ahead);
  const daily = {};
  for (let d = addDays(from, -28); d <= to; d = addDays(d, 1)) daily[d] = d <= TODAY ? runLoadOn(d) + (d === TODAY ? plannedRunOn(d) : 0) : plannedRunOn(d);
  const sum = (d, n) => { let x = 0; for (let i = 0; i < n; i++) x += daily[addDays(d, -i)] || 0; return x; };
  const out = [];
  for (let d = from; d <= to; d = addDays(d, 1)){
    const acute = sum(d, 7), chronic = sum(d, 28) / 4;
    const future = d > TODAY;
    const lo = future ? acute * 0.85 : chronic * 0.8;
    const hi = future ? acute * 1.15 : chronic * 1.3;
    out.push({ d, acute, chronic, lo, hi, safe: chronic * 1.3, future });
  }
  // Bei längeren Zeiträumen ausdünnen, damit die Linie ruhig bleibt (heute bleibt immer drin)
  const step = FR.key === '1y' ? 7 : FR.key === '3m' ? 3 : 1;
  if (step === 1) return out;
  const iT = out.findIndex(p => p.d === TODAY);
  return out.filter((p, i) => i === iT || i === out.length - 1 || ((iT - i) % step === 0 && i < iT) || (i > iT && (i - iT) % step === 0));
}
function runBuildSection(){
  const S = runSeries(); if (!S.length) return '';
  const W = 350, H = 140;
  const max = Math.max(10, ...S.map(p => Math.max(p.acute, p.hi, p.future ? p.safe : 0))) * 1.1;
  const X = i => i / (S.length - 1) * W, Y = v => H - v / max * H;
  const iT = S.findIndex(p => p.d === TODAY);
  const past = S.slice(0, iT + 1), fut = S.slice(iT);
  const zone = `<polygon points="${S.map((p,i)=>`${X(i).toFixed(1)},${Y(p.hi).toFixed(1)}`).join(' ')} ${S.map((p,i)=>`${X(i).toFixed(1)},${Y(p.lo).toFixed(1)}`).reverse().join(' ')}" fill="#5FD17A" fill-opacity="0.55"></polygon>`;
  const pl = (arr, off, extra) => `<polyline fill="none" stroke="#F1EAFF" stroke-width="2.5" vector-effect="non-scaling-stroke" ${extra||''} points="${arr.map((p,i)=>`${X(i+off).toFixed(1)},${Y(p.acute).toFixed(1)}`).join(' ')}"></polyline>`;
  const safe = `<polyline fill="none" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" points="${fut.map((p,i)=>`${X(i+iT).toFixed(1)},${Y(p.safe).toFixed(1)}`).join(' ')}"></polyline>`;
  const today = `<line x1="${X(iT)}" x2="${X(iT)}" y1="0" y2="${H}" stroke="#C9B6FF" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"></line>`;
  const t = S[iT];
  let msg;
  if (t.acute < t.lo) msg = 'Gerade unter deinem gewohnten Laufniveau. Ein lockerer Lauf mehr diese Woche bringt dich zurück in den grünen Bereich.';
  else if (t.acute > t.hi) msg = 'Mehr Laufen, als dein Körper gerade gewohnt ist. Die nächsten Tage lieber ruhig angehen.';
  else msg = 'Du liegst im grünen Bereich: Dein Laufen wächst gesund.';
  const over = fut.find(p => p.acute > p.safe * 1.05 && p.d > TODAY);
  if (over) msg += ` Achtung: Um den ${shortD(over.d)} zieht der Plan schneller an, als dein Laufen mitwächst.`;
  // Achsenbeschriftung: Start, Heute, Ende
  const lab = `<div style="position:relative;height:16px;font-size:12px;color:var(--lilac);margin-top:4px">
    <span style="position:absolute;left:0">${FR.key==='1y'?MON[parseD(S[0].d).getUTCMonth()]:shortD(S[0].d)}</span>
    <span style="position:absolute;left:${(iT/(S.length-1)*100).toFixed(1)}%;transform:translateX(-50%)">Heute</span>
    ${iT/(S.length-1) < 0.85 ? `<span style="position:absolute;right:0">${shortD(S[S.length-1].d)}</span>` : ''}</div>`;
  return `<section style="background:var(--bg2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px">
    <h2>Laufaufbau</h2>
    <p style="line-height:1.5;color:var(--text)">${esc(msg)}</p>
    <div class="scrub" data-scrub="run" style="position:relative;touch-action:pan-y;cursor:crosshair"><svg width="100%" height="140" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Laufbelastung der letzten sieben Tage mit Soll-Zone" style="display:block">${zone}${today}${safe}${pl(past,0)}${pl(fut,iT,'stroke-dasharray="2 5" stroke-linecap="round"')}</svg>
    <div class="scrubline" style="display:none;position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.7;pointer-events:none"></div></div>
    ${lab}
    <div class="legend"><span><i style="background:#F1EAFF"></i>Laufbelastung 7 Tage</span><span><i style="background:#7CE38B"></i>Soll-Zone</span><span><i style="background:#FF6B6B;height:2px"></i>Sicherheitsgrenze</span></div>
    <p class="small" style="color:var(--soft);line-height:1.5">Nur Läufe zählen. Die <b style="color:var(--text)">Soll-Zone</b> wächst mit dir: Sie richtet sich nach deinem Laufen der letzten vier Wochen. Rechts von „Heute“ zeigt sie, was dein Plan vorsieht. Liegt die Linie in der Zone, wird dein Laufen gesund mehr.</p></section>`;
}
// Antippen im Laufaufbau-Diagramm
document.addEventListener('pointerdown', e => {
  const s = e.target.closest('.scrub[data-scrub="run"]'); if (!s) return;
  e.stopImmediatePropagation();
  runScrub(s, e.clientX);
  const mv = ev => runScrub(s, ev.clientX);
  const up = () => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); setTimeout(scrubEnd, 1500); };
  document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
}, true);
function runScrub(el, clientX){
  const S = runSeries(); const r = el.getBoundingClientRect();
  const i = Math.round(Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * (S.length - 1)), p = S[i];
  const l = el.querySelector('.scrubline'); l.style.display = 'block'; l.style.left = `calc(${(i/(S.length-1)*100).toFixed(2)}% - 1px)`;
  const tip = document.getElementById('scrubtip'); tip.style.display = 'flex';
  const inZone = p.acute >= p.lo && p.acute <= p.hi;
  tip.innerHTML = `<b>${p.d===TODAY?'Heute':`${WD[wd(p.d)]}, ${shortD(p.d)}`}${p.future?' (Plan)':''}</b><span>Laufbelastung <b>${Math.round(p.acute)}</b></span><span>Soll <b>${Math.round(p.lo)}–${Math.round(p.hi)}</b></span><span style="color:${inZone?'#2E8B3E':'#C0392B'};font-weight:700">${inZone?'im Soll':p.acute<p.lo?'darunter':'darüber'}</span>`;
}

/* ---------- Sheets ---------- */
function openSheet(html){ closeSheet(); const d=document.createElement('div'); d.className='scrim'; d.id='scrim'; d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${html}</div>`; d.addEventListener('click',e=>{ if(e.target===d) closeSheet(); }); document.body.appendChild(d); }
function closeSheet(){ const s=$('#scrim'); if(s) s.remove(); }
function toast(t){ const o=document.createElement('div'); o.className='toast'; o.textContent=t; document.body.appendChild(o); setTimeout(()=>o.remove(),3200); }

function menuSheet(id){
  const ev = plan().find(e=>String(e.id)===String(id)); if(!ev) return;
  const st = statusOf(ev);
  let h = `<h2>${esc(ev.name)}</h2><p class="small muted">${nice(ev.date)} · ${ev.cat.name} · ${mins(ev.dur)} min</p>`;
  h += `<button class="btn" data-act="detail" data-id="${ev.id}">Details ansehen</button>`;
  if (st.s!=='done' && ev.date>=TODAY){
    h += `<button class="btn" data-act="move" data-id="${ev.id}">Verschieben</button>`;
    if (isRun(ev.type)) h += `<div class="grid2">${Object.entries(VARIANTS).map(([k,l])=>`<button class="btn${ev.variant===k?' sel':''}" data-act="variant" data-v="${k}" data-id="${ev.id}">${l}</button>`).join('')}</div>`;
    h += `<button class="btn ghost" data-act="remove" data-id="${ev.id}">Streichen</button>`;
  }
  openSheet(h);
}
function conflict(ev, day){
  // Ampel: rot = harte Einheit am selben Tag, gelb = harte Einheit am Vortag/Folgetag oder schon eine Einheit am Tag
  const others = plan().filter(e=>e.id!==ev.id);
  const on = others.filter(e=>e.date===day);
  const near = others.filter(e=>e.date===addDays(day,-1)||e.date===addDays(day,1));
  if (on.some(e=>e.cat.hard) && ev.cat.hard) return { c:'r', why:'Am selben Tag liegt schon eine harte Einheit.' };
  if (ev.cat.hard && near.some(e=>e.cat.hard)) return { c:'y', why:`Direkt daneben liegt ${near.find(e=>e.cat.hard).name}. Zwei harte Tage hintereinander erhöhen das Verletzungsrisiko.` };
  if (on.length) return { c:'y', why:`An dem Tag steht schon ${on[0].name}. Doppeltag möglich, aber anstrengend.` };
  return { c:'g', why:'Passt gut.' };
}
function unfitSheet(id){
  openSheet(`<h2>Heute nicht fit</h2><p class="small muted">Was ist los? Der Plan passt sich an.</p>
  <button class="btn" data-act="unfit-go" data-v="zeit" data-id="${id}">Wenig Zeit</button>
  <button class="btn" data-act="unfit-go" data-v="muede" data-id="${id}">Müde oder schlecht geschlafen</button>
  <button class="btn" data-act="unfit-go" data-v="krank" data-id="${id}">Krank oder Schmerzen</button>`);
}

/* ---------- Aktionen ---------- */
function setVariant(id, v){
  const ev0 = plan().find(e=>String(e.id)===String(id));
  const before = compTargets();
  if (ST.variants[id]===v) delete ST.variants[id]; else ST.variants[id]=v;
  const ev = plan().find(e=>String(e.id)===String(id));
  const c = compensate(ev);
  save(); closeSheet(); render();
  syncShapes([id, ...before, ...compTargets()]);
  if (c) toast(`Ausgleich: ${WD[wd(c.tgt.date)]} ${c.tgt.name} +${mins(c.extra)} min locker`);
  else if (ev.load < ev.baseLoad) toast('Angepasst. Der kleine Rest wird nicht nachgeholt, das ist okay.');
  else toast(ST.variants[id] ? `Angepasst: ${VARIANTS[v]}` : 'Zurückgesetzt');
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const { act, id, v, d } = b.dataset;
  if (act==='detail'){ closeSheet(); location.hash = `#detail-${id}`; }
  if (act==='menu') menuSheet(id);
  if (act==='variant') setVariant(id, v);
  if (act==='reset'){ const before = compTargets(); delete ST.variants[id]; compensate(plan().find(x=>String(x.id)===String(id))); save(); render(); toast('Zurückgesetzt'); syncShapes([id, ...before, ...compTargets()]); }
  if (act==='move') moveSheet(id);
  if (act==='moveto'){
    const ev = plan().find(x=>String(x.id)===String(id));
    const c = d===ev.date ? null : conflict(ev,d);
    if (c && c.c!=='g' && b.dataset.confirm!=='1'){ $('#mvhint').textContent = `${c.why} Nochmal tippen zum Bestätigen.`; document.querySelectorAll('.mv [data-confirm]').forEach(x=>x.dataset.confirm=''); b.dataset.confirm='1'; return; }
    if (d===dateOf(ev.raw.start_date_local)) delete ST.moves[id]; else ST.moves[id]=d;
    save(); closeSheet(); render(); toast(`Verschoben auf ${nice(d)}`);
    pushMove(id, d);
  }
  if (act==='remove'){
    if (LIVE && b.dataset.ok!=='1'){ openSheet(`<h2>Einheit streichen?</h2><p style="line-height:1.5">Sie wird auch aus Intervals und von deiner Uhr entfernt.</p><div class="grid2"><button class="btn ghost" data-act="dragno">Abbrechen</button><button class="btn" data-act="remove" data-ok="1" data-id="${id}" style="background:#FF6B6B;color:var(--bg)">Streichen</button></div>`); return; }
    ST.removed[id]=true; save(); closeSheet(); render(); toast('Gestrichen. Lockere Einheiten holen wir nicht nach.'); pushDelete(id); }
  if (act==='unfit') unfitSheet(id);
  if (act==='unfit-go'){
    ST.unfit[TODAY]=v;
    if (v==='zeit') setVariant(id,'kuerzer');
    if (v==='muede') setVariant(id,'leichter');
    if (v==='krank'){ ST.removed[id]=true; const hard = plan().filter(x=>x.date>TODAY && x.date<=addDays(TODAY,2) && x.cat.hard); hard.forEach(x=>ST.variants[x.id]='leichter'); save(); closeSheet(); render(); toast('Heute Pause. Die nächsten harten Einheiten sind entschärft.'); pushDelete(id); syncShapes(hard.map(x=>String(x.id))); }
  }
  if (act==='feel'){ ST.feel[id]=v; save(); render(); toast('Danke, fließt in die nächste Woche ein.'); }
  if (act==='noop') toast('Liegt schon auf deiner Uhr.');
});

function render(){
  try { autoReplan(); } catch(e){}
  const h = location.hash.replace('#','') || 'heute';
  const m = h.match(/^([a-z]+)(?:-(\d+))?$/) || [null,'heute']; const r = m[1], id = m[2];
  const root = $('#root');
  const V = { woche:viewWeek, detail:()=>viewDetail(id), form:viewForm, workouts:viewWorkouts, gen:viewGenerated, bib:()=>viewLibrary(id), ziel:viewGoal, planvorschau:viewPlanPreview };
  root.innerHTML = `<main class="app">${(V[r]||viewToday)()}</main>`;
}
addEventListener('hashchange', ()=>{ window.scrollTo(0,0); render(); });
function loginView(msg){
  return `<main class="app" style="justify-content:center;min-height:90vh">
    <div class="logo" style="font-size:32px;justify-content:center"><span>ON</span><span class="tog off" style="width:52px;height:30px;padding:4px"><i style="width:22px;height:22px"></i></span><span>TRACK</span></div>
    <form id="loginform" class="note" style="display:flex;flex-direction:column;gap:12px">
      <label class="small muted" style="display:flex;flex-direction:column;gap:6px">Zugangscode
        <input type="password" name="token" autocomplete="current-password" style="height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-family:inherit;font-size:16px"></label>
      <p class="small" style="color:#FF6B6B;min-height:18px" role="alert">${msg||''}</p>
      <button class="btn lime" type="submit">Los</button></form></main>`;
}
async function loadLive(token){
  const r = await fetch(`${CONFIG.apiBase}/api/snapshot`, { headers:{ Authorization:`Bearer ${token}` } });
  if (r.status === 401) return 'auth';
  if (!r.ok) return 'err';
  SNAP = await r.json(); TODAY = SNAP.today; THR = SNAP.settings.threshold_pace_ms;
  return 'ok';
}
async function init(){
  if (LIVE){
    let token = ''; try { token = localStorage.getItem('ontrack.token') || ''; } catch(e){}
    if (!token){ $('#root').innerHTML = loginView(); return; }
    $('#root').innerHTML = `<main class="app" style="justify-content:center;min-height:90vh;text-align:center"><p class="muted">Lade deine Daten …</p></main>`;
    let res = 'err';
    try { res = await loadLive(token); } catch(e){}
    if (res === 'auth'){ try { localStorage.removeItem('ontrack.token'); } catch(e){} $('#root').innerHTML = loginView('Der Zugangscode stimmt nicht.'); return; }
    if (res === 'err' && !SNAP.events.length){ $('#root').innerHTML = loginView('Server nicht erreichbar. Bitte später nochmal versuchen.'); return; }
  }
  render();
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'loginform') return;
  e.preventDefault();
  const t = new FormData(e.target).get('token').trim();
  if (!t) return;
  try { localStorage.setItem('ontrack.token', t); } catch(e){}
  init();
});
init();
</script>
